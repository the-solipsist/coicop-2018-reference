              and other financial institutions
            - fees and service charges and implicit charges of money market funds,
              non-money market investment funds, brokers and the like
            - administrative charges and implicit charges of pension funds and the
              like
            - remittance fees
            children:
              12.2.9.1:
                title: Remittances fees
                tags:
                - S
                includes:
                - remittances fees for financial services provided by financial auxiliaries,
