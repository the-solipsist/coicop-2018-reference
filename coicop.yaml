  '13':
    title: PERSONAL CARE, SOCIAL PROTECTION AND MISCELLANEOUS GOODS AND SERVICES
    intro: 'Division 13 covers goods and services for personal care (13.1), jewellery
      and watches (13.2), services of social protection (13.3), and all other services
      for households, which are not classified elsewhere (13.9). Goods and services
      for personal care cover electric and non-electric appliances for personal care
      as well as hairdressing services. Goods of personal effects cover jewellery
      and watches, celebration and devotional articles, and travel goods and articles._x000D_

      _x000D_

      Social protection services cover child-care, non-medical retirement homes for
      elderly persons and disabled persons, services to maintain persons in their
      private homes and related service. Group 13.9 cover all the other services for
      households, which are not classified elsewhere, such as fees for legal and administrative
      services, fees for real estate agencies, charges for undertaking, payment for
      various personal services (e.g. graphologists, bodyguards, matrimonial agencies,
      etc.)._x000D_

      _x000D_

      This division also includes religious services.'
