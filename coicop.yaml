                  heating and lighting, maintenance of lifts and refuse disposal chutes,
                  pool cleaning, etc. in multi-occupied buildings
                excludes:
                - household services, such as window cleaning, disinfecting, fumigation
                  and pest extermination (05.6.2.9)
              04.4.4.9:
