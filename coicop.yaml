  '07':
    title: TRANSPORT
    intro: 'Division 07 covers four main categories of goods and services for the
      purpose of transportation: purchase of vehicles (07.1), goods and services for
      the operation of the personal transport equipment (07.2), passenger transport
      services (07.3), and transport services of goods (07.4)._x000D_

      _x000D_

      Purchase of vehicles covers motor cars, motorcycles, bicycles and animal drawn
      vehicles. Due to the high share of second-hand motor vehicles in private consumption
      expenditures, separate sub-classes for new and for second-hand motor cars are
      distinguished._x000D_

      _x000D_

      The second group concerning the operation of personal transport equipment cover
      parts and accessories for personal transport equipment, fuels and lubricants
      and the repair and maintenance of personal transport equipment. This group also
      includes expenditures for parking spaces in garages or in public places, expenditures
      for tolls and the expenditures to acquire a driving certificate._x000D_

      _x000D_

      Passenger transport services are structured by the mode of transport. However,
      due to fact that transport tickets may cover more than one mode of transport,
      a class for the combined passenger transport was created (07.3.6)._x000D_

      _x000D_

      The fourth group covers postal and courier services, removal and storage services,
      and the delivery services of any kinds of goods, if charged separately._x000D_

      _x000D_

      Division 07 does not cover purchases of recreational vehicles, such as camper
      vans, caravans, trailers, aeroplanes and boats (09.1.2).'
    children:
