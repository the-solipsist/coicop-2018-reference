      '13.3':
        title: SOCIAL PROTECTION
        intro: 'Social protection as defined here covers non-medical assistance and
          support services provided to persons who are: elderly, disabled, having
          occupational injuries and diseases, survivors, unemployed, destitute, homeless,
          low-income earners, indigenous people, immigrants, refugees, alcohol and
          substance abusers, etc._x000D_

          _x000D_

          It also covers assistance and support services provided to families and
          children.'
        children:
          13.3.0:
            title: Social protection
            tags:
            - S
            intro: Social protection services include residential care, home help
              and day care.
            includes:
            - non-medical retirement homes for elderly persons, non-medical residences
              for disabled persons, rehabilitation centres providing non-medical long-term
              support for individuals rather than health care and rehabilitative therapy,
              schools for disabled persons where the main aim is to help students
              overcome their disability
            - non-medical help to maintain elderly and disabled persons at home (home-cleaning
              services, meal programmes, non-medical day-care centres, day-care services
              and holiday-care services)
            - child-minding outside the home, nurseries, day-care facilities wet-nurses,
              crèches, kindergartens (other than educational), play schools and other
              child-minding facilities
            - counselling, guidance, arbitration, fostering and adoption services
              for families
            excludes:
            - babysitters, etc. (05.6.2.1)
            - social assistance and other social care services that are integrated
              into a package of care along with medical services are to be included
              in 06.2.3 if medical services do not require an overnight stay and 06.3.2
              if they do. For example, services of medical convalescent homes or convalescent
              hospitals; services of homes for the elderly with nursing care; inpatient
              care hospices; services of palliative care establishments for the terminally
              ill; services of nursing homes; rest homes with nursing care; services
              of skilled nursing facilities; services of teaching nursing homes; services
              of residential mental retardation facilities; mental health and substance
              abuse facilities for chronic patient (e.g. those with dementia); services
