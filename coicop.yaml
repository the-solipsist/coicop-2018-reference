      '02.3':
        title: TOBACCO
        intro: This group covers all purchases of tobacco and tobacco products by
          households, including purchases of tobacco in restaurants, cafés, bars,
          service stations, etc. due to these venues not adding value, or a service,
          to the tobacco products sold. The consumption of tobacco through shisha
          or hookah pipes in these venues, such as restaurants, cafés or bars, are
          included in Division 11 as the venue does provide a service. Electronic
          cigarette refills are included in this group - even though they do not contain
          tobacco - as they are a substitute for smoking tobacco products.
        children:
          02.3.0:
            title: Tobacco
            tags:
            - ND
            includes:
            - cigarettes, cigarette tobacco and tobacco leaf
            - cigarette papers and single use filters that are consumed with the cigarette
            - cigars, pipe tobacco, chewing tobacco or snuff
            - refills for electronic cigarettes, with or without nicotine
            - tobacco that is consumed with a shisha or hookah pipes if consumed at
              home
            - tobacco that is purchased in bars and restaurants, provided that a service
              charge is not applied
            excludes:
            - tobacco that is consumed with a shisha or hookah pipes in restaurants,
              cafés, shisha lounges (11.1.1)
            - other smokers’ articles; electronic cigarette devices (13.2.9.1)
            children:
              02.3.0.1:
                title: Cigarettes
                tags:
                - ND
                includes:
                - cigarettes
                - cigarettes that are purchased in bars and restaurants, provided
                  that a service charge is not applied
              02.3.0.2:
                title: Cigars
                tags:
                - ND
                includes:
                - cigars
                - cigars that are purchased in bars and restaurants, provided that
                  a service charge is not applied
              02.3.0.9:
                title: Other tobacco products
                tags:
                - ND
                includes:
                - pipe tobacco, chewing tobacco, hookah blends, snus or snuff
                - cigarette tobacco and tobacco leaf
                - cigarette papers and single use filters that are consumed with the
                  cigarette
                - refills for electronic cigarettes, with or without nicotine
                - tobacco that is consumed with a shisha or hookah pipes if consumed
                  at home
                excludes:
                - tobacco that is consumed with a shisha or hookah pipes in restaurants,
                  cafés, shisha lounges (11.1.1)
                - other smokers’ articles; electronic cigarette devices (13.2.9.1)
      '02.4':
        title: NARCOTICS
        intro: This group covers all narcotics purchased by households, both legal
          and illegal.
        children:
          02.4.0:
            title: Narcotics
            tags:
            - ND
            includes:
            - marijuana, opium, cocaine and their derivatives
            - other vegetable-based narcotics, such as cola nuts, kava, chat, betel
              leaves, psilocybin mushroom and betel nuts
            - other narcotics including chemicals and synthetic drugs
            excludes:
            - narcotics for medicinal purpose (06.1.1.1)
            - prepared marijuana cigarettes and pipes containing marijuana, hashish
              or similar purchased in coffee shops for immediate consumption (11.1.1.1)
            children:
