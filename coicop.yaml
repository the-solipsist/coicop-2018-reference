      '12.2':
        title: FINANCIAL SERVICES
        intro: Financial services are subdivided by financial intermediation services
          indirectly measured and by the other forms of actual and implicit charges
          and remittance fees for financial services.
        children:
          12.2.1:
            title: Financial intermediation services indirectly measured
            tags:
            - S
            intro: Financial intermediation services indirectly measured (FISIM) is
              calculated as the difference between the actual bank interest receivable
              and the SNA interest receivable by financial corporations on the loans
              they issue, and the difference between SNA interest payable and the
              actual bank interest payable by financial corporations on the deposits
              of their customers.
            includes:
            - financial intermediation services indirectly measured of deposit taking
              corporations
            also_includes:
            - implicit financial services provided by moneylenders, credit card issuers,
              finance associates of retailers who may be responsible for providing
              loans, pawnshops and corporations involved in lending (for example,
              in providing student loans and import/export loans)
            children:
