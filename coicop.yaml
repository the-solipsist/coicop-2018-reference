      '06.2':
        title: OUTPATIENT CARE SERVICES
        intro: 'This group covers all preventive, dental, curative, rehabilitative
          and long-term care services not provided during an overnight stay. The admission
          criteria are irrelevant as well as the setting where the outpatient care
          occurs or the type of provider. As such outpatient services may be delivered
          in a hospital setting or outside a hospital setting including at home or
          even on the street by any type of health care provider. Outpatient services
          include all medicines and health products supplied directly by a health
          care provider for consumption or use outside a health facility/institution,
          if not separately identifiable from the service._x000D_

          _x000D_

          It also includes respite care as well as services to maintain persons in
          their private homes that are integrated into a package of medical outpatient
          care services.'
        excludes:
        - the vaccine itself when separately invoiced from the preventive service
          (06.1.1.1)
        - dental, curative, rehabilitative and long-term care services provided overnight
          (06.3)
        - control and/or follow-up services after symptoms appeared with overnight
          care are to be included in (06.3)
        - laboratory and imaging services separately identifiable from the preventive
          service (06.4)
        - non-medical services to maintain persons in their private homes that are
          not integrated to a package of medical care (13.3.0.2)
        children:
          06.2.1:
            title: Preventive care services
            tags:
            - S
            intro: Preventive services aim at avoiding illnesses, diseases; detecting
              diseases (e.g. via screening). The main distinction between preventive
              services and other outpatient services is the criterion "before symptoms
              appear".
            includes:
            - immunization/vaccination services
            - family planning and counselling
            - healthy condition monitoring services (prenatal care and postnatal care
              services
            - general and routine check-ups other than dental
            - child growth and development check-ups
            - early disease detection services, before symptoms appear (including
              screening, diagnostic tests and medical examinations directed to detect
              communicable and non-communicable diseases before symptoms appear)
            also_includes:
            - laboratory and imaging services needed to provide preventive services
              when jointly invoiced with the time and skills of the personnel
            excludes:
            - dental, curative, rehabilitative and long-term care services provided
              overnight (06.3)
            - the vaccine itself when separately invoiced from the preventive service
              (06.1.1.1)
            - control and/or follow-up services after symptoms appeared with overnight
              care are to be included in (06.3)
            - laboratory and imaging services separately identifiable from the preventive
              service (06.4)
            - non-medical services to maintain persons in their private homes that
              are not integrated to a package of medical care (13.3.0.2)
            children:
              06.2.1.1:
                title: Immunization services
                tags:
                - S
                intro: 'The expenditure involved in the consultation, both for the
                  time and skills of the personnel and the purchase of the vaccine
                  itself when jointly invoiced with the service should be accounted
                  for._x000D_

                  _x000D_

                  Illustrative examples are immunization for:_x000D_

                  - polio, rabies, rubella, tetanus, varicella (chicken pox) and yellow
                  fever,_x000D_

                  - influenza,_x000D_

                  - measles,_x000D_

                  - meningococcal infections, mumps, pertussis (whooping cough), pneumococcal
                  infections,_x000D_

                  - diphtheria, hepatitis, herpes zoster, HPV.'
                includes:
                - immunization/vaccination services for maternal and child care
                - travel and tourism vaccination as well as any other compulsory or
                  voluntary immunization/vaccination service
                excludes:
                - the vaccine itself when separately invoiced from the service (06.1.1.1)
              06.2.1.9:
                title: Other preventive services
                tags:
                - S
                includes:
                - family planning and counselling (including genetic counselling)
                - prenatal and postnatal care services
                - general routine check-up services including child growth and development
                - identification of genetic abnormalities
                - screening, diagnostic tests and medical examinations directed to
                  detect communicable and non-communicable diseases (e.g. malaria,
                  tuberculosis, breast cancer, prostate cancer, cervical cancer, colon
                  rectal cancer, diabetes, HIV/AIDS and any other communicable or
                  non-communicable disease) before symptoms appear
                - any other medical service provided before symptoms appear
                also_includes:
                - laboratory and imaging services needed to provide preventive services
                  jointly invoiced with the time and skills of the personnel (e.g.
                  mammogram)
                excludes:
                - dental routine preventive check-up (06.2.2.1)
                - control and follow-up services after symptoms appeared without overnight
                  care (06.2.2, 06.2.3)
                - control and/or follow-up services after symptoms appeared with overnight
                  care (06.3)
                - laboratory and imaging services separately identifiable from the
                  preventive service (06.4)
          06.2.2:
            title: Outpatient dental services
            tags:
            - S
            includes:
            - services of dentists, dental practitioners, endodontist, dental surgeons;
              oral and maxillofacial surgeons; oral pathologists; orthodontists; paedodontists;
              periodontists; prosthodontists; oral hygienists and other dental auxiliaries
              that do not require an overnight stay
            also_includes:
            - services of dentists for aesthetic reasons
            excludes:
            - all health products (pharmaceutical, medical, assistive, therapeutic)
              needed to deliver outpatient dental services separately invoiced from
              the provider’s service fee (06.1)
            - services of medical analysis laboratories and imaging centres separately
              identifiable from the dental services received (06.4.1.0)
            children:
              06.2.2.1:
                title: Dental preventive services
                tags:
                - S
                includes:
                - routine preventive dental check-ups
              06.2.2.9:
                title: Other outpatient dental services
                tags:
                - S
                includes:
                - all other dental services that do not require an overnight stay
                  (excluding preventive dental services)
                - all cost concerning dentures, inlays, crowns, braces, etc. (including
                  the fitting costs)
                also_includes:
                - services of dentists for aesthetic reasons
                excludes:
                - all health products (pharmaceutical, medical, assistive, therapeutic)
                  needed to deliver outpatient dental services separately invoiced
                  from the provider’s service fee (06.1)
                - services of medical analysis laboratories and imaging centres separately
                  identifiable from the dental services received (06.4.1.0)
          06.2.3:
            title: Other outpatient care services
            tags:
            - S
            intro: 'Include all medical services other than preventive and dental
              that do not require an overnight stay aimed at relieving symptoms of
              illnesses, diseases, injuries (06.2.3.1); reduce the severity of illnesses,
              diseases, injuries (06.2.3.1); protect against exacerbation and/or complication
              of illnesses, diseases, injuries (06.2.3.1); restoring health status
              (06.2.3.1); maintaining the level of health available or preventing
              the deterioration of a health condition (06.2.3.2)._x000D_

              _x000D_

              The admission criteria, the type of provider as well as the setting
              where these curative, rehabilitative, long-term care outpatient care
              services occurs are irrelevant as long as no overnight care is involved.'
            includes:
            - services at hospitals or in a hospital setting without an overnight
              stay (excluding preventive (06.2.1) and dental (06.2.2))
            - medical day care services, i.e. services delivered in a hospital setting
              (sometimes in medical day care centres) to a patient who is formally
              admitted as long as it does not involve an overnight stay
            - home-based hospital treatment (e.g. dialysis (06.2.3.2)); medical services
              delivered at home (e.g. palliative care (06.2.3.2)); medical and nursing
              services to maintain persons in their private home (including the elderly
              and persons with disabilities (06.2.3.2)); nursing care delivered at
              home including care aimed at retarding or reducing deterioration or
              maintaining functionality (e.g. nasogastric feeding) or for the management
              of chronic diseases (06.2.3.2)
            - services delivered in individual (e.g. private office) or group consulting
              facilities (excluding preventive services 06.2.1 and dental 06.2.2)
              by any type of provider (doctors, specialists, nurses and other health
              care practitioners)
            - medical services delivered on the street as well as any other outpatient
              service delivered outside a hospital setting
            also_includes:
            - all health products (pharmaceutical, medical, assistive, therapeutic),
              diagnostic imaging services and medical laboratory services needed to
              deliver outpatient services not separately identifiable from the provider’s
              service fee (doctor/specialist/nurse/other health care practitioner)
            excludes:
            - medicines and health products (medical, assistive, therapeutic) separately
              invoiced from the provider’s service fee (doctor/specialist/nurse and
              other health care practitioner) (06.1)
            - preventive services (06.2.1)
            - outpatient dental services (06.2.2)
            - diagnostic imaging services and medical laboratory services separately
              identifiable from the provider’s service fee (doctor/specialist/nurse
              and other health care practitioner) (06.4.1.0)
            - patient emergency transportation services and emergency rescue (06.4.2.0)
            children:
              06.2.3.1:
                title: Outpatient curative and rehabilitative services
                tags:
                - S
                intro: 'Comprises curative and rehabilitative services that do not
                  require an overnight stay._x000D_

                  _x000D_

                  Curative care comprises health care contacts during which the principal
                  intent is to relieve symptoms of illness or injury, to reduce the
                  severity of an illness or injury, or to protect against exacerbation
                  and/or complication of an illness and/or injury that could threaten
                  life or normal function. Curative services aim at bringing the person
                  back to its original status before the cure was needed._x000D_

                  _x000D_

                  Rehabilitation aims to achieve and maintain optimal functioning.
                  In some cases, after rehabilitation a patient can be better than
                  before or only avoid deterioration.'
                includes:
                - all components of the curative care of illness or the treatment
                  of injury; the surgery performed; diagnostic and therapeutic procedures;
                  and obstetric services as long as it does not involve an overnight
                  stay
                - 'curative and rehabilitative care regardless of the type of provider:
                  (specialised) physician and other health professionals (e.g. nurses
                  and midwives)'
                - 'curative and rehabilitative services provided in any setting: in
                  hospitals without an overnight stay; in individual (e.g. private
                  office) or group consulting facilities; at home or any other setting
                  outside the hospital including on the street'
                - physical, psychological and speech therapy. As such it includes
                  services of chiropractors; physiotherapists and physical therapists;
                  speech therapists; audiologists; inhalation or respiratory therapists,
                  etc. All health products (pharmaceutical, medical, assistive, therapeutic)
                  needed to deliver curative outpatient services not separately invoiced
                  from the provider’s service fee
                - all health products (pharmaceutical, medical, assistive, therapeutic)
                  needed to deliver curative/rehabilitative outpatient services invoiced
                  from the provider’s service fee (doctor/specialist/nurse/other health
                  care practitioner)
                excludes:
                - medicines and health products (medical, assistive, therapeutic)
                  separately invoiced from the provider’s service fee (doctor/specialist/nurse
                  and other health care practitioner) (06.1)
                - preventive services (06.2.1)
                - outpatient dental services (06.2.2)
                - diagnostic imaging services and medical laboratory services separately
                  identifiable from the provider’s service fee (doctor/specialist/nurse
                  and other health care practitioner) (06.4.1.0)
                - patient emergency transportation services and emergency rescue (06.4.2.0)
              06.2.3.2:
                title: Outpatient long-term care services
                tags:
                - S
                intro: 'Outpatient long-term care services do not aim at curing an
                  illness or rehabilitating an individual, but to prevent deterioration
                  of a health condition and remain at the level of health available.
                  Some medical activities and nursing are inherent parts of this status
                  quo. Individuals getting such type of outpatient long-term care
                  might include for example: the elderly with limited capacity to
                  perform daily activities; physically disabled members of the households;
                  those with chronic conditions._x000D_

                  _x000D_

                  In some cases, outpatient long-term care services are part of a
                  package of services including social assistance and social transfer.
                  Where possible only the medical component should go into Division
                  06 (the social protection part should go to Division 13). If it
                  is not possible to distinguish both the choice of the Division should
                  be based upon the extent to which the package of services predominantly
                  includes a social protection component (Division 13) or medical
                  component (Division 06).'
                includes:
                - services of medical day-care centres; medical day-care services
                  for the elderly and persons with disabilities
                - home-based long-term care hospital treatment without an overnight
                  stay (e.g. dialysis)
                - medical and nursing services to maintain persons in their private
                  home (including the elderly and persons with disabilities)
                - nursing care delivered at home including care aimed at retarding
                  or reducing deterioration or maintaining functionality (e.g. nasogastric
                  feeding) or for the management of chronic diseases (e.g. provision
                  of the prescribed psychiatric medication)
                - non-medical services to maintain persons in their private homes
                  that are integrated into a package of care and jointly invoiced
                - all health products (pharmaceutical, medical, assistive, therapeutic),
                  diagnostic imaging services and medical laboratory services needed
                  to deliver outpatient services jointly invoiced with the provider’s
                  service fee (doctor/specialist/nurse/other health care practitioner)
                excludes:
                - medicines and health products (medical, assistive, therapeutic)
                  separately invoiced from the provider’s service fee (doctor/specialist/nurse
                  and other health care practitioner) (06.1)
                - diagnostic imaging services and medical laboratory services separately
                  invoiced from the provider’s service fee (doctor/specialist/nurse
                  and other health care practitioner) (06.4.1.0)
                - patient emergency transportation services and emergency rescue (06.4.2.0)
                - social assistance services relate to care that enables a person
                  to live independently in a house or apartment, community activities
                  and occupational support given on a continuing or recurrent basis
                  to individuals, such as activities whose primary purpose is social
                  and leisure (13.3.0.3)
      '06.3':
        title: INPATIENT CARE SERVICES
        intro: 'The overnight stay criterion is the main distinction between outpatient
          care services (06.2) and inpatient care services (06.3). The type of provider
          is irrelevant. This may be a hospital, nursing care facility, or facilities
          classified as ambulatory care providers but which perform occasional procedures
          requiring overnight accommodation._x000D_

          _x000D_

          It can also include health facilities within any type of establishment that
          accommodates patients justifying an overnight stay. Tuberculosis hospitals
          and sanatoriums are often organized to include accommodation along with
          medical treatment, which is the predominant purpose during a stay in such
          facilities.'
