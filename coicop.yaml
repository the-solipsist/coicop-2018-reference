          05.6.2:
            title: Domestic services and household services
            tags:
            - S
            intro: Domestic services (05.6.2.1) are services provided by personnel
              employed by households, such as butlers, maids, cooks, nannies, governesses,
              cleaners, au pairs, gardeners) who receive a compensation or wage for
              their services. Domestic services also include services such as babysitting,
              gardening and cleaning supplied by enterprises and self-employed persons.
              Other household services (05.6.2.9) are services provided by enterprises
              and self-employed persons that are not routinely provided by staff employed
              by households, such as carpet cleaning, pest extermination, disinfection.
            includes:
            - domestic services supplied by paid staff employed in private service,
              such as butlers, cooks, maids, drivers, gardeners, governesses and au
              pairs or nannies
            - similar services, including babysitting and housework, supplied by enterprises
              or self-employed persons
            - household services, such as window cleaning, disinfecting, fumigation
              and pest extermination
            - dry-cleaning, laundering and dyeing of household linen, household textiles
              and carpets
            - shampooing of carpets
            - pest extermination, disinfection
            - tendency of flat in absence of owner
            also_includes:
            - house-maids that iron household linen and clothes in the family residence
            excludes:
            - dry-cleaning, laundering and dyeing of garments (03.1.4.1)
            - security services (04.3.2.0)
            - refuse collection (04.4.2.0)
            - sewerage collection (04.4.3)
            - co-proprietor charges for caretaking, gardening, stairwell cleaning,
              heating and lighting, maintenance of lifts and refuse disposal chutes,
