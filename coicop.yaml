                  for providing loans, pawnshops and corporations involved in lending
                  (for example, in providing student loans and import/export loans)
          12.2.2:
            title: Explicit charges by deposit-taking corporations
            tags:
            - S
            includes:
            - explicit charges for the financial services of deposit-taking corporations,
              such as commercial banks, credit unions, cooperative banks, savings
              banks, post banks, and postal savings banks
            excludes:
            - remittances fees (12.2.9.1)
            children:
              12.2.2.0:
                title: Explicit charges by deposit-taking corporations
                tags:
                - S
                includes:
                - actual charges for the financial services of deposit-taking corporations,
                  such as commercial banks, credit unions, cooperative banks, savings
                  banks, post banks, and postal savings banks
                excludes:
                - remittances fees (12.2.9.1)
          12.2.9:
            title: Other financial services
            tags:
            - S
            includes:
