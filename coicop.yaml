  08:
    title: INFORMATION AND COMMUNICATION
    intro: 'Division 08 covers three main groups of goods and services: information
      and communication equipment, including equipment for the reception, recording
      and reproduction of sound and vision (08.1), software (08.2), and information
      and communication services (08.3). Information and communication services include
      telephone other communication services, Internet access services, TV and radio
      licences, fee and subscription services, including streaming services of film
      and music._x000D_

      _x000D_

      Division 08 also includes repair, maintenance and hire of information and communication
      equipment.'
