  '03':
    title: CLOTHING AND FOOTWEAR
    intro: 'Division 03 covers all clothing materials, garments, articles and accessories
      (03.1), footwear (03.2), and related services including cleaning, repair and
      hire of clothing (03.1.4) and footwear (03.2.2). The purchase of second-hand
      clothing and footwear should be included in the same classes as the new articles
      as the purpose is the same. Unisex garments and footwear should be classified
      according to the gender of the person wearing them._x000D_

      _x000D_

      Division 03 excludes sport-and game-specific sports- and footwear (09.2.2.1).'
    children:
      '03.1':
        title: CLOTHING
        intro: 'The clothing classified in this group covers materials purchased to
          be transformed into clothing, garments and accessories and services related
          to clothing._x000D_

          _x000D_

          Made-to-measure refers to the service of providing custom fitted clothing
          when the retailer supplies all of the materials and is included in Group
          03.1.2 (Garments) as the cost of the garment usually outweighs the cost
          of the service. Tailoring refers to creating clothing garments where the
          main material is supplied by the customer and is classified in Group 03.1.4
          (Cleaning, repair, tailoring and hire of clothing) as the service is the
          higher expenditure.'
        children:
          03.1.1:
            title: Clothing materials
            tags:
            - SD
            includes:
            - clothing materials of natural fibres, of synthetic fibres and of their
              mixtures
            - leather, fur, fusible webbing, wadding and felt filling for making wearing
              apparel
            excludes:
            - furnishing fabrics (05.2.1.1)
            children:
              03.1.1.0:
