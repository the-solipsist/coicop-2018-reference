      '07.3':
        title: PASSENGER TRANSPORT SERVICES
        intro: 'Purchases of transport services are generally classified by mode of
          transport. When a ticket covers two or more modes of transport - for example,
          intra-urban bus and underground or inter-urban train and ferry - and the
          expenditure cannot be apportioned between them, then such purchases should
          be classified in (07.3.5.0)._x000D_

          _x000D_

          Costs of meals, snacks, drinks, refreshments or accommodation services have
          to be included if covered by the fare and not separately priced. If separately
          priced, these costs have to be classified in Division 11._x000D_

          _x000D_

          School transport services are included, but ambulance services are excluded
          (06.4.2.0).'
