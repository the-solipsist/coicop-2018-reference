      '04.4':
        title: WATER SUPPLY AND MISCELLANEOUS SERVICES RELATING TO THE DWELLING
        children:
          04.4.1:
            title: Water supply
            tags:
            - ND
            includes:
            - Water supply
            also_includes:
            - associated expenditures, such as rental of meters, reading of meters,
              standing charges, etc
            excludes:
            - drinking water sold in bottles or containers (01.2.5.0)
            - hot water or steam purchased from district heating plants (04.5.5.0)
            children:
              04.4.1.1:
                title: Water supply through network systems
                tags:
                - ND
                includes:
                - all charges usually included in the bills paid by households, including
                  meters installations and rentals, volumetric or fix charge for water
                  consumption through mains, except steam and hot water (on a fee
                  and contract basis)
                also_includes:
                - associated expenditures, such as rental of meters, reading of meters,
                  standing charges, etc
                excludes:
                - drinking water sold in bottles or containers (01.2.5.0)
                - hot water or steam purchased from district heating plants (04.5.5.0)
              04.4.1.2:
                title: Water supply through other systems
                tags:
                - ND
                includes:
                - services paid at a public stand post/fountain and to water vendors
                  (e.g. by tanker truck, cart)
                excludes:
                - drinking water sold in bottles or containers (01.2.5.0)
          04.4.2:
            title: Refuse collection
            tags:
            - S
            includes:
            - refuse collection and disposal
            - fees for recycling paid by households
            children:
              04.4.2.0:
                title: Refuse collection
                tags:
                - S
                includes:
                - refuse collection and disposal
                - fees for recycling paid by households
          04.4.3:
            title: Sewage collection
            tags:
            - S
            intro: 'Sewer systems, also known as sanitary sewer systems, are (most
              often) an underground carriage system (most usually water-borne) specifically
              for transporting sewage from houses and commercial building and industries,
              through pipes, or other conduits to treatment facilities or disposal
              sites. They are part of an overall system referred to as a sewerage
              or sewage system._x000D_

              _x000D_

              Sewage may be treated to reduce water pollution before discharge to
              surface waters. Sanitary sewers serving mixed urban agglomerations (including
              commercial and industrial areas) carry "municipal wastewater" which
              comprises a mix from all sources including in some cases, surface run-off
              and storm-water._x000D_

              _x000D_

              "Separate" sewer systems are designed to transport sewage alone. In
              municipalities served by sewers, separate storm drains may convey surface
              run-off directly to surface waters. "Separate" sewers are distinguished
              from "combined" sewers, which combine sewage with storm water runoff
              in the same conduit. "Separate" sewer systems are often preferred because
              they avoid the production of large volumes of combined wastewater flows.
              However, in certain circumstances "combined" sewers may be preferred
              and reduce costs._x000D_

              _x000D_

              Basic sanitation systems: are improved sanitation facilities where excreta
              are contained or disposed onsite. These are generally where faecal (and
              other) material is collected in a pit or septic tanks or are composting
              toilets. Their purpose is to hygienically separate human excreta from
              human contact.'
            includes:
            - Sewage collection, emptying cesspools and disposal
            children:
              04.4.3.1:
                title: Sewage collection through sewer systems
                tags:
                - S
                includes:
                - services paid to the sanitation or water provider or municipality
                  for the collection, transport and disposal of sewage through sewer
                  systems
              04.4.3.2:
                title: Sewage collection through onsite sanitation systems
                tags:
                - S
                includes:
                - services paid to empty and evacuate liquid waste (excreta and waste
                  water) from onsite sanitation systems (pit latrines, septic tanks
                  and/or soak pits) and clean them
                - payments for using communal/commercial collective toilets
          04.4.4:
            title: Other services relating to the dwelling n.e.c.
            tags:
            - S
            includes:
            - co-proprietor charges for caretaking, gardening, stairwell cleaning,
              heating and lighting, maintenance of lifts and refuse disposal chutes,
              pool cleaning, etc. in multi-occupied buildings
            - road and sidewalk cleaning and chimney sweeping
            - measuring background radiation and content of harmful substances in
              dwellings
            - landscaping and cleaning of grounds surrounding the dwelling
            - snow removal
            excludes:
            - household services, such as window cleaning, disinfecting, fumigation
              and pest extermination (05.6.2.9)
            children:
