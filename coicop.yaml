  '06':
    title: HEALTH
    intro: 'Division 06 covers four main categories, one of which concerns medicine
      and health products (06.1), while the three other concern health services. Specifically,
      outpatient care services that do not require an overnight stay (06.2); inpatient
      care services provided during an overnight stay (06.3); diagnostic imaging services,
      medical laboratory services, patient emergency transportation and emergency
      rescue services (06.4). Medicines and health products (06.1) cover all products
      that are separately invoiced from health services except when administered under
      the direct supervision of a health care professional during an overnight stay
      (06.3)._x000D_

      _x000D_

      Services and products included in Division 06 are those that can only be used
      in response to a health need. These services and products aim at preventing
      the occurrence of illnesses, diseases (e.g. through vaccination); cure from
      illnesses, diseases, injuries; relieving symptoms of illnesses, diseases, injuries;
      reduce the severity of illnesses, diseases, injuries; protect against exacerbation
      and/or complication of illnesses, diseases, injuries; restoring the health status
      or maintaining/preventing the deterioration of a health condition._x000D_

      _x000D_

      The division also includes services provided by health care professional purely
      for aesthetic beautification purposes (e.g. cosmetic surgery; dental work to
      whiten teeth)._x000D_

      _x000D_

      Division 06 excludes food believed to be highly beneficial to health, especially
      food grown organically as well as foods or food ingredients that have been shown
      to affect specific functions or system of the body (Division 01).'
