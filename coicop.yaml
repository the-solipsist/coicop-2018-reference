  '05':
    title: FURNISHINGS, HOUSEHOLD EQUIPMENT AND ROUTINE HOUSEHOLD MAINTENANCE
    intro: 'Division 05 covers a wide range of products for the equipment of the house
      or dwelling and the household durables, semi-durables and non-durable as well
      as some kind of household services. Division 05 includes all kinds of furniture
      and lightning equipment (05.1), household textiles (05.2), major and smaller
      electric household appliances (05.3), glassware, tableware and household utensils
      (05.4), tools and equipment for house and garden (05.5), and goods for the routine
      household maintenance (05.6.1)._x000D_

      _x000D_

      Division 05 also includes repair, installation and rental services of the goods
      classified in Division 05._x000D_

      _x000D_

      Domestic services by paid staff in private service, supplied by enterprises
      or self-employed persons are included, as well as window cleaning and disinfecting
      services, dry-cleaning and laundering of household textiles and carpets (05.6.2).'
