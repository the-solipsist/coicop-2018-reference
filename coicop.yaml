  09:
    title: RECREATION, SPORT AND CULTURE
    intro: 'Division 09 covers a wide range of goods and services for recreation,
      sport and culture and it structured into eight groups. The first group (09.1)
      covers recreation durables: photographic equipment, other major durables for
      recreation, such as camper vans, boats, yachts, aeroplanes and the like). Group
      09.2 covers non-major durable recreational goods, such as games and toys, including
      video game computers, celebration articles, equipment for sport, camping and
      open-air recreation. The third group (09.3) covers garden products, plants and
      flowers, the purchases of pets, and expenditures for pets, excluding veterinary
      services). Recreational services (09.4) cover rental, maintenance and repair
      of goods classified in Division 09, veterinary and other services for pets,
      recreational and leisure services, such as amusement parks, games of chance
      and expenditures for sporting services, both expenditures for practising sports
      as well as expenditures for attendance of sport events._x000D_

      _x000D_

      Group 09.5 covers cultural goods, such as musical instruments and audio-visual
      media, followed by cultural services (09.6), which cover cinemas, theatres,
      concerts, museums, and other cultural sites, as well as photographic services.
      Whether books or newspapers are in printed or electronic form is irrelevant
      for classifying them under 09.7._x000D_

      _x000D_

      The last group (09.8) covers package holidays, which as a bundle include all
      kinds of services, such as transportation, accommodation, foods provision, tour
      guide, etc. Expenditures for package holiday cannot be split into its components
      and thus a separate classification category was created. The length of the package
      holiday and whether the holiday destination is within the home country or outside
      does not matter.'
