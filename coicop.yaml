            - educational kindergartens (10.1.0.1)
            children:
              13.3.0.1:
                title: Child care services
                tags:
                - S
                includes:
                - child-minding outside the home
                - nurseries, day-care facilities, wet-nurses, crèches and other child-minding
                  facilities for babies
                - after school centres
                excludes:
                - babysitters, etc. (05.6.2.1)
                - educational kindergartens (10.1.0.1)
              13.3.0.2:
                title: Non-medical retirement homes for elderly persons and non-medical
                  residences for disabled persons
                tags:
                - S
                includes:
                - non-medical retirement homes for elderly persons
                - non-medical residences for disabled persons
                excludes:
                - social assistance and other social care services that are integrated
                  into a package of care along with medical services are to be included
                  in 06.2.3 if medical services do not require an overnight stay and
                  06.3.2 if they do. For example, services of medical convalescent
                  homes or convalescent hospitals; services of homes for the elderly
                  with nursing care; inpatient care hospices; services of palliative
                  care establishments for the terminally ill; services of nursing
                  homes; rest homes with nursing care; services of skilled nursing
                  facilities; services of teaching nursing homes; services of residential
                  mental retardation facilities; mental health and substance abuse
                  facilities for chronic patient (e.g. those with dementia); services
                  of alcoholism or drug addiction rehabilitation facilities (other
                  than licensed hospitals)
                - services of mental health convalescent homes or hospitals (06.3.2.0)
