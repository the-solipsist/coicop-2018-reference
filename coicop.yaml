  '02':
    title: ALCOHOLIC BEVERAGES, TOBACCO AND NARCOTICS
    intro: 'Division 02 covers the purchase of alcoholic beverages (02.1) and of tobacco
      products (02.3) and narcotics (02.4), regardless of where these are consumed
      but not provided as part of a food and beverage serving service._x000D_

      _x000D_

      Division 02 also includes low and non-alcoholic beverages, which are generally
      alcoholic, such as non-alcoholic beer. Services for the production of alcohol
      for own consumption (02.2) are also included in this Division._x000D_

      _x000D_

      Division 02 excludes alcoholic beverages purchased for immediate consumption
      in hotels, restaurants, cafés, bars, kiosks, street vendors, automatic vending
      machines, etc. (11.1.1).'
    children:
      '02.1':
        title: ALCOHOLIC BEVERAGES
        intro: The beverages classified here include low or non-alcoholic beverages
          which generally contain some alcohol.
        children:
          02.1.1:
            title: Spirits and liquors
            tags:
            - ND
            includes:
            - eaux-de-vie, liqueurs and other spirits with high alcohol content
            - mead
            - pomace brandy, such as pisco, grappa, marc, etc
            - aperitifs other than wine-based aperitifs
            excludes:
            - wine-based aperitifs (02.1.2.1, 02.1.2.2)
            children:
              02.1.1.0:
