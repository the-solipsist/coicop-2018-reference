              repair of the dwelling
            - locksmith services
            - service of laying fitted carpets and linoleum
            - security services
            excludes:
            - separate purchases of materials made by households with the intention
              of undertaking the maintenance or repair themselves (04.3.1.1)
            - locksmith services for cars (07.2.3.0)
            - bodyguards (13.9.0.9)
            - services engaged for major maintenance and repair (intermediate consumption)
              or for extension and conversion of the dwelling (capital formation)
            children:
              04.3.2.0:
                title: Services for the maintenance, repair and security of the dwelling
                tags:
