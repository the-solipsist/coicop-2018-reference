                excludes:
                - wine-based aperitifs (02.1.2.1, 02.1.2.2)
          02.1.2:
            title: Wine
            tags:
            - ND
            includes:
            - wine, cider and perry, including sake
            - wine-based aperitifs, fortified wines, champagne and other sparkling
              wines
            - ice-wine
            - low and non-alcoholic wine
