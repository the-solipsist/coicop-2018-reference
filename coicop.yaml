meta:
  name: COICOP 2018
  version: '2018'
  source: United Nations Statistics Division
  levels:
  - Division
  - Group
  - Class
  - Subclass
  - Sub-subclass
data:
  '01':
    title: FOOD AND NON-ALCOHOLIC BEVERAGES
    intro: 'Division 01 covers food (01.1) and non-alcoholic beverages (01.2) purchased
      by the household mainly for consumption or preparation at home. It excludes
      food and non-alcoholic beverages that are provided as part of a food serving
      service (Division 11)._x000D_

      _x000D_

      Services for processing primary goods to produce food and non-alcoholic beverages
      for own consumption are also included in this Division (01.3)._x000D_

      _x000D_

      Food is composed of all edible goods that are purchased and consumed by the
      household with the purpose of nourishing. It includes: cereals and cereal products;
      meat; fish and other seafood; milk, other dairy products and eggs; oils and
      fats; fruit and nuts; vegetables, tubers, plantains, cooking bananas and pulses;
      sugar, confectionery and desserts; salt, sauces and condiments, spices and culinary
      herbs and seeds._x000D_

      _x000D_

      Division 01 also includes baby food and ready-made food that can be eaten as
      it is or after heating. Non-alcoholic beverages include drinks that do not contain
      any alcohol.'
    children:
      '01.1':
        title: FOOD
        intro: 'Food purchased by the household mainly for consumption or preparation
          at home. It excludes food that is provided as part of a food serving service._x000D_

          _x000D_

          Food is composed of all edible goods that are purchased and consumed by
          the household with the purpose of nourishing. It includes: cereals and cereal
          products; meat; fish and other seafood; milk, other dairy products and eggs;
          oils and fats; fruit and nuts; vegetables, tubers, plantains, cooking bananas
          and pulses; sugar, confectionery and desserts; salt, sauces and condiments,
          spices and culinary herbs and seeds.'
        includes:
        - products that need to be cooked and further prepared as well as ready-made
          food
        excludes:
        - local delivery services of food or drinks, when separately invoiced (07.4.9.2)
        - products for animal feeding (09.3.2.2)
        - food provided by food serving services (Division 11)
        children:
          01.1.1:
            title: Cereals and cereal products
            tags:
            - ND
            children:
              01.1.1.1:
                title: Cereals
                tags:
                - ND
                intro: Dried grains of cereals, whether or not broken or precooked
                  (steamed), but not further prepared.
                includes:
                - wheat
                - rice, including parboiled rice
                - sorghum
                - barley
                - millet
                - maize (corn)
                - quinoa
                - teff
                also_includes:
                - bulgur
                - rye
                - oats
                - triticale
                - buckwheat
                - canary seed
                - quihuicha or Inca wheat
                - canagua or coaihua
                - adlay or Job’s tears
                - mixed cereal grains, in the form of dried grains, also including
                  other ingredients (provided that these are not the main ingredient)
                  but not further processed
                excludes:
                - flour of cereals (01.1.1.2)
                - breakfast cereals (01.1.1.4)
                - ready-made preparations based on cereals, such as ready-made soups
                  based on cereals (01.1.9.1)
                - baby rice cereals and other baby cereals (01.1.9.2)
                - seeds for planting (09.3.1.2)
                children:
                  01.1.1.1.1:
                    title: Wheat
                    intro: Dried grains of wheat, whether or not broken or precooked,
                      but not further prepared.
                    includes:
                    - bulgur
                    - farro, broken and pearled
                  01.1.1.1.2:
                    title: Rice
                    intro: Dried grains of rice, whether or not broken or precooked,
                      but not further prepared.
                    includes:
                    - semi- or wholly milled rice
                    - husked rice
                    - parboiled rice
                  01.1.1.1.3:
                    title: Sorghum
                    intro: Dried grains of sorghum, whether or not precooked, but
                      not further prepared.
                  01.1.1.1.4:
                    title: Barley
                    intro: Dried grains of barley, whether or not precooked, but not
                      further prepared.
                  01.1.1.1.5:
                    title: Millet
                    intro: Dried grains of millet, whether or not precooked, but not
                      further prepared.
                  01.1.1.1.6:
                    title: Maize (corn)
                    intro: Dried grains of maize (corn), both on the cob or not, whether
                      or not precooked, but not further prepared.
                  01.1.1.1.7:
                    title: Quinoa
                    intro: Dried grains of quinoa, whether or not precooked, but not
                      further prepared.
                  01.1.1.1.8:
                    title: Teff
                    intro: Dried grains of teff, whether or not precooked, but not
                      further prepared.
                  01.1.1.1.9:
                    title: Other cereals
                    intro: Dried grains of other cereals, whether or not broken or
                      precooked, but not further prepared.
                    includes:
                    - rye
                    - oats
                    - triticale
                    - buckwheat
                    - canary seed
                    - quihuicha or Inca wheat
                    - canagua or coaihua
                    - adlay or Job’s tears
                    - other cereals n.e.c
                    - mixed cereal grains, in the form of dried grains, but not further
                      prepared, also including other dehydrated ingredients, e.g.
                      vegetables, provided that these are not the main ingredients
              01.1.1.2:
                title: Flour of cereals
                tags:
                - ND
                intro: Flour of cereals mentioned in Subclass 01.1.1.1 whether instant
                  (precooked – steamed – or added with yeasts) or not.
                includes:
                - flour of cereals mentioned in Subclass 01.1.1.1
                also_includes:
                - instant flour for bakery products added with yeasts
                - polenta flour, whether instant (pre-steamed) or not
                excludes:
                - flour as baby food, baby rice cereals and other baby cereals (01.1.9.2)
                children:
                  01.1.1.2.1:
                    title: Flour of wheat
                    intro: Flour of wheat, whether instant or not.
                  01.1.1.2.2:
                    title: Flour of rice
                    intro: Flour of rice, whether instant or not.
                  01.1.1.2.3:
                    title: Flour of sorghum
                  01.1.1.2.4:
                    title: Flour of barley
                  01.1.1.2.5:
                    title: Flour of millet
                  01.1.1.2.6:
                    title: Flour of maize or cornmeal
                    intro: Flour of maize, whether instant or not.
                    includes:
                    - polenta flour, whether instant or not
                  01.1.1.2.7:
                    title: Flour of quinoa
                  01.1.1.2.8:
                    title: Flour of teff
                  01.1.1.2.9:
                    title: Other flours of cereals
                    intro: Flour of other cereals n.e.c.
                    excludes:
                    - almond flour and other nuts flour (01.1.6.9.1)
                    - fruit flour (01.1.6.9.1)
                    - flour as baby food, baby rice cereals and other baby cereals
                      (01.1.9.2.2)
              01.1.1.3:
                title: Bread and bakery products
                tags:
                - ND
                includes:
                - bread and bread rolls
                - crisp bread, rusks, toasted bread, crackers
                - tortillas
                - injera
                - pizza bases without topping, whether pre-cooked or not
                - gingerbread and the like
                - sweet biscuits (cookies)
                - waffles and wafers
                - ice cream cones
                - crumpets, muffins, croissants, cakes, sweet tarts, sweet pies, and
                  other pastry goods and cakes
                excludes:
                - pizza (with topping), quiche, meat or fish pies (01.1.9.1)
                children:
                  01.1.1.3.1:
                    title: Bread
                    intro: Bread and bakery products used as bread.
                    includes:
                    - bread and bread rolls
                    - crisp bread, rusks, toasted bread, crackers
                    - tortillas
                    - injera
                  01.1.1.3.9:
                    title: Other bakery products
                    intro: Other baked products, excluding bread or other bakery products
                      used as bread.
                    includes:
                    - pizza bases without topping, whether pre-cooked or not
                    - gingerbread and the like
                    - sweet biscuits (cookies)
                    - waffles and wafers
                    - ice cream cones
                    - crumpets, muffins, croissants, cakes, sweet tarts, sweet pies,
                      and other pastry goods and cakes
              01.1.1.4:
                title: Breakfast cereals
                tags:
                - ND
                includes:
                - cornflakes, oatmeal and oat flakes, muesli, granola, puffed cereals
                  including puffed rice cakes
                - breakfast cereals with nuts or dried fruit
                excludes:
                - popcorn (1.1.1.9)
                children:
                  01.1.1.4.0:
                    title: Breakfast cereals
              01.1.1.5:
                title: Macaroni, noodles, couscous and similar pasta products
                tags:
                - ND
                includes:
                - pasta uncooked, whether stuffed or not, and couscous
                - uncooked dumplings, ravioli and similar
                excludes:
                - bulgur (01.1.1.1)
                - prepared dishes containing stuffed pasta; prepared couscous dishes
                  (01.1.9.1)
                children:
                  01.1.1.5.0:
                    title: Macaroni, noodles, couscous and similar pasta products
              01.1.1.9:
                title: Other cereal and grain mill products
                tags:
                - ND
                includes:
                - mixes and doughs for the preparation of bakery products
                - popcorn
                - granola bars
                - malt; malt extract
                - chips and crisps of cereals
                also_includes:
                - seitan and other meat substitutes made from cereals
                excludes:
                - soy meat and burgers, veggie burgers, tofu, tempeh and other meat
                  substitutes made from vegetables and nuts; potato starch, tapioca,
                  sago and other starches (01.1.7.9)
                - ready-made preparations based on cereals, such as ready-made soups
                  based on cereals (01.1.9.1)
                children:
                  01.1.1.9.0:
                    title: Other cereal and grain mill products
          01.1.2:
            title: Live animals, meat and other parts of slaughtered land animals
            tags:
            - ND
            children:
              01.1.2.1:
                title: Live land animals
                tags:
                - ND
                intro: Live land animals, both domestic and wild, for food purpose.
                includes:
                - cattle (cow, veal, common ox, zebu or humped ox, watussi ox, gaur,
                  gayal, banteng, Tibetan yak)
                - buffaloes (Indian or water buffaloes, Asiatic buffalo or arni, Celebese
                  anoa or pigmy buffaloes, African buffaloes, such as the dwarf buffaloes
                  and the large Caffrarian buffaloes, the American bison or "buffalo"
                  and the European bison, the "beefalo" (a cross between a bison and
                  a domestic beef animal)
                - pigs
                - goats, lambs and sheep
                - poultry (chicken, ducks, geese, turkeys and guinea fowl)
                - hares and rabbits
                - horses, donkeys and other equines
                - camels, dromedaries, alpaca, llama, guanaco, vicuña and other camelids
                - ostriches, emus, rhea, pheasant, grouse, pigeon, quail and other
                  birds
                - snakes and other reptiles
                - spiders, scorpions, and other insects and worms
                - terrestrial snails
                - frogs
                excludes:
                - live fish (01.1.3.1)
                - other live seafood (01.1.3.4)
                - live animals for transport (07.1.4.0)
                - live animals for recreation (09.1.2.4)
                children:
                  01.1.2.1.1:
                    title: Bovine animal, live
                    intro: Cattle and buffaloes purchased live for food purpose.
                    includes:
                    - 'cattle: cow, veal, common ox, zebu or humped ox, watussi ox,
                      gaur, gayal, banteng, Tibetan yak'
                    - 'buffaloes: Indian or water buffaloes, Asiatic buffalo or arni,
                      Celebese anoa or pigmy buffaloes, African buffaloes, such as
                      the dwarf buffaloes and the large Caffrarian buffaloes, the
                      American bison or "buffalo" and the European bison, the "beefalo"
                      (a cross between a bison and a domestic beef animal)'
                  01.1.2.1.2:
                    title: Pigs, live
                    intro: Pigs purchased live for food purpose.
                  01.1.2.1.3:
                    title: Goats, lambs and sheep, live
                    intro: Goats, lambs and sheep purchased live for food purpose.
                  01.1.2.1.4:
                    title: Poultry, live
                    intro: Chicken, ducks, geese, turkeys, and guinea fowl purchased
                      live for food purpose.
                  01.1.2.1.5:
                    title: Hares and rabbits, live
                    intro: Hares and rabbits purchased live for food purpose.
                  01.1.2.1.9:
                    title: Other live animals
                    intro: Other animals n.e.c. purchased live for food purpose.
                    includes:
                    - horses, donkeys and other equines
                    - camels, dromedaries, alpaca, llama, guanaco, vicuña and other
                      camelids
                    - ostriches, emus, rhea, pheasant, grouse, pigeon, quail and other
                      birds
                    - snakes and other reptiles
                    - spiders, scorpions, and other insects and worms
                    - terrestrial snails
                    - frogs
                    - other animals n.e.c
                    excludes:
                    - live fish (01.1.3.1)
                    - other live seafood (01.1.3.4)
                    - live animals for transport (07.1.4.0)
              01.1.2.2:
                title: Meat, fresh, chilled or frozen
                tags:
                - ND
                intro: Meat of all animals, both domestic and wild, fresh, chilled
                  or frozen.
                includes:
                - meat of cattle (cow, veal, common ox, zebu or humped ox, watussi
                  ox, gaur, gayal, banteng, Tibetan yak)
                - meat of buffaloes (Indian or water buffaloes, Asiatic buffalo or
                  arni, Celebese anoa or pigmy buffaloes, African buffaloes, such
                  as the dwarf buffaloes and the large Caffrarian buffaloes, the American
                  bison or "buffalo" and the European bison, the "beefalo" (a cross
                  between a bison and a domestic beef animal)
                - meat of pigs
                - meat of goats, lambs and sheep
                - meat of poultry, (chicken, ducks, geese, turkeys and guinea fowl)
                - meat of hares and rabbits
                - meat of horses, donkeys and other equines
                - meat of camels, dromedaries, alpaca, llama, guanaco, vicuña and
                  other camelids
                - meat of seals, walruses, whales and other marine mammals
                - meat of antelopes, deer, boars, kangaroos
                - meat of ostriches, emus, rhea, pheasant, grouse, pigeon, quail and
                  other birds
                - meat of snakes, alligators and other reptiles
                - spiders, scorpions, insects, and worms
                - terrestrial snails
                - frogs
                also_includes:
                - minced meat of animals above
                children:
                  01.1.2.2.1:
                    title: Meat of bovine animals, fresh, chilled or frozen
                    intro: Meat of cattle and of buffaloes fresh, chilled or frozen.
                    includes:
                    - 'Fresh, chilled or frozen meat of:'
                    - 'cattle: cow, veal, common ox, zebu or humped ox, watussi ox,
                      gaur, gayal, banteng, Tibetan yak'
                    - 'buffaloes: Indian or water buffaloes, Asiatic buffalo or arni,
                      Celebese anoa or pigmy buffaloes, African buffaloes, such as
                      the dwarf buffaloes and the large Caffrarian buffaloes, the
                      American bison or "buffalo" and the European bison, the "beefalo"
                      (a cross between a bison and a domestic beef animal)'
                  01.1.2.2.2:
                    title: Meat of pigs, fresh, chilled or frozen
                    intro: Meat of pigs, fresh, chilled or frozen.
                  01.1.2.2.3:
                    title: Meat of goats, lambs and sheep, fresh, chilled or frozen
                    intro: Meat of goats, lambs and sheep, fresh, chilled or frozen.
                  01.1.2.2.4:
                    title: Meat of poultry, fresh, chilled or frozen
                    intro: Meat of chicken, ducks, geese, turkeys and guinea fowl,
                      fresh, chilled or frozen.
                  01.1.2.2.5:
                    title: Meat of hares and rabbits fresh, chilled or frozen
                    intro: Meat of hares and rabbits fresh, chilled or frozen.
                  01.1.2.2.6:
                    title: Meat of horses and other equines, fresh, chilled or frozen
                    intro: Meat of horses, donkeys and other equines, fresh, chilled
                      or frozen.
                  01.1.2.2.7:
                    title: Meat of camels and camelids, fresh, chilled or frozen
                    intro: Meat of camels, dromedaries, alpaca, llama, guanaco, vicuña
                      and other camelids, fresh, chilled or frozen.
                  01.1.2.2.9:
                    title: Other meat, fresh, chilled or frozen
                    intro: Other meat fresh, chilled or frozen n.e.c.
                    includes:
                    - meat of seals, walruses, whales and other marine mammals
                    - meat of antelopes, deer, boars, kangaroos
                    - meat of ostriches, emus, rhea, pheasant, grouse, pigeon, quail
                      and other birds
                    - meat of snakes, alligators and other reptiles
                    - spiders, scorpions, insects, and worms
                    - terrestrial snails
                    - frogs, fresh, chilled or frozen
              01.1.2.3:
                title: Meat, dried, salted, in brine or smoked
                tags:
                - ND
                intro: Meat of all animals, dried, salted, in brine or smoked.
                includes:
                - bacon, ham, salami
                excludes:
                - pâté (01.1.2.5)
                children:
                  01.1.2.3.1:
                    title: Meat of bovine, salted, dried or smoked
                    intro: Meat of cattle and of buffaloes salted, dried or smoked.
                    includes:
                    - 'Salted, dried or smoked meat of:'
                    - 'cattle: cow, veal, common ox, zebu or humped ox, watussi ox,
                      gaur, gayal, banteng, Tibetan yak'
                    - 'buffaloes: Indian or water buffaloes, Asiatic buffalo or arni,
                      Celebese anoa or pigmy buffaloes, African buffaloes, such as
                      the dwarf buffaloes and the large Caffrarian buffaloes, the
                      American bison or "buffalo" and the European bison, the "beefalo"
                      (a cross between a bison and a domestic beef animal)'
                  01.1.2.3.2:
                    title: Meat of pigs, cuts, salted, dried or smoked (bacon and
                      ham)
                    intro: Meat of pigs, cuts, salted, dried or smoked.
                    includes:
                    - bacon, ham, salami
                  01.1.2.3.9:
                    title: Other meat, dried, salted or smoked
                    intro: Other meat, dried, salted or smoked n.e.c.
                    includes:
                    - meat of seals, walruses, whales and other marine mammals
                    - meat of antelopes, deer, boars, kangaroos
                    - meat of ostriches, emus, rhea, pheasant, grouse, pigeon, quail
                      and other birds
                    - meat of snakes, alligators and other reptiles
                    - spiders, scorpions, insects, and worms
                    - terrestrial snails
                    - frogs, dried, salted or smoked
              01.1.2.4:
                title: Offal, blood and other parts of slaughtered animals, fresh,
                  chilled or frozen, dried, salted, in brine or smoked
                tags:
                - ND
                intro: Offal and other parts of slaughtered animals, fresh, chilled
                  or frozen, dried, salted, in brine or smoked.
                includes:
                - bones
                - pork heads, tails and ears; chicken feet
                excludes:
                - offal, blood, and other parts of slaughtered animals' preparations
                  (01.1.2.5)
                children:
                  01.1.2.4.0:
                    title: Offal, blood and other parts of slaughtered animals, fresh,
                      chilled or frozen, dried, salted, in brine or smoked
              01.1.2.5:
                title: Meat, offal, blood and other parts of slaughtered animals'
                  preparations
                tags:
                - ND
                intro: Meat, offal or blood preparations, whether frozen or not.
                includes:
                - sausages and similar products of meat, offal or blood
                - marinated meat
                - canned meat, meat extracts, meat juices
                - minced meat mix, from different types of meat
                - all kind of pâté, including liver pâté
                - breaded meat
                - other preparations of meat, meat offal or blood
                children:
                  01.1.2.5.1:
                    title: Sausages and similar products of meat, offal or blood
                  01.1.2.5.2:
                    title: Canned meat
                    intro: Meat of all animals generally precooked and preserved in
                      a can.
                  01.1.2.5.3:
                    title: Pâté, including liver pâté
                    intro: Pâté of all kinds, including liver pâté.
                  01.1.2.5.9:
                    title: Other meat, offal or blood preparations n.e.c.
                    includes:
                    - marinated meat
                    - meat extracts, meat juices
                    - minced meat mix, from different types of meat
                    - breaded meat
                    - other preparations of meat, meat offal or blood
          01.1.3:
            title: Fish and other seafood
            tags:
            - ND
            intro: Fish and other seafood, harvested or farmed in fresh and marine
              waters, such as crustaceans, molluscs and other aquatic invertebrates,
              as whole or part of (i.e. cuts, fillets, meat, minced or not), including
              livers, roes, fins, meal and other offal.
            includes:
            - aquatic turtles
            - other edible aquatic invertebrates and animals, such as sea cucumbers,
              sea urchins, sea squirts, and jellyfish
            excludes:
            - marine mammals, frogs and terrestrial snails (01.1.2.1, 01.1.2.2, 01.1.2.3)
            - seaweeds and other aquatic plants (01.1.7.4)
            children:
              01.1.3.1:
                title: Fish, live, fresh, chilled or frozen
                tags:
                - ND
                intro: Fish, live, fresh, chilled or frozen.
                includes:
                - fish, live for food purpose
                - fish, fresh, chilled or frozen
                - fish fillets and meat, minced or not, fresh, chilled or frozen
                excludes:
                - livers, roes, fins and other offal (01.1.3.7)
                children:
                  01.1.3.1.1:
                    title: Freshwater fish, live, fresh, chilled, or frozen
                    includes:
                    - tilapias, catfish (including pangasius), carps, Nile perch and
                      eels, live, fresh, chilled or frozen
                  01.1.3.1.2:
                    title: Salmonoidae, live, fresh, chilled, or frozen
                    includes:
                    - salmons and trouts, live, fresh, chilled or frozen
                  01.1.3.1.3:
                    title: Flatfish, live, fresh, chilled, or frozen
                    includes:
                    - soles, turbots, halibuts and plaices, live, fresh, chilled or
                      frozen
                  01.1.3.1.4:
                    title: Gadiformes, live, fresh, chilled, or frozen
                    includes:
                    - cods, haddock, hakes, Alaska pollock and blue whitings, live,
                      fresh, chilled or frozen
                  01.1.3.1.5:
                    title: Tunas, skipjack or stripe-bellied bonito, live, fresh,
                      chilled, or frozen
                    includes:
                    - tunas and skipjack or stripe-bellied bonito, live, fresh, chilled
                      or frozen
                  01.1.3.1.6:
                    title: Other pelagic fish, live, fresh, chilled, or frozen
                    includes:
                    - herrings, sardines, sardinella, brisling or sprats, mackerels
                      and swordfish, live, fresh, chilled or frozen
                  01.1.3.1.9:
                    title: Other fish, live, fresh, chilled, or frozen
                    includes:
                    - other fish, live, fresh, chilled or frozen n.e.c
              01.1.3.2:
                title: Fish, dried, salted, in brine or smoked
                tags:
                - ND
                intro: Fish, dried, salted or in brine; smoked.
                includes:
                - fish fillets and meat, dried, salted or in brine; smoked
                excludes:
                - livers, roes, fins and other offal (01.1.3.7)
                children:
                  01.1.3.2.1:
                    title: Salmonoidae, smoked
                    includes:
                    - smoked salmons and trouts
                  01.1.3.2.2:
                    title: Gadiformes, dried, salted or in brine
                    includes:
                    - cods, haddock, hakes, Alaska pollock and blue whitings, dried,
                      salted or in brine
                  01.1.3.2.9:
                    title: Other fish, dried, salted, in brine, smoked
                    includes:
                    - other fish, dried, salted, in brine or smoked n.e.c
              01.1.3.3:
                title: Fish preparations
                tags:
                - ND
                intro: Prepared foodstuffs made of fish, whether frozen or not.
                includes:
                - fillets merely covered with batter or bread crumbs, whether frozen
                  or not
                - crabmeat and surimi
                excludes:
                - caviar and caviar substitutes and prepared and preserved shark fins;
                  livers, roes, fins and other offal (01.1.3.7)
                children:
                  01.1.3.3.1:
                    title: Tunas, skipjack or stripe-bellied bonito, prepared or preserved
                    includes:
                    - preparations of tunas, skipjack or stripe-bellied bonito
                  01.1.3.3.2:
                    title: Other pelagic fish, prepared or preserved
                    includes:
                    - preparations of herrings, sardines, sardinella, brisling or
                      sprats, mackerels and swordfish
                  01.1.3.3.3:
                    title: Caviar and caviar substitutes
                    intro: Caviar (prepared from the roe of the sturgeon) and caviar
                      substitutes (products consumed as caviar but prepared from eggs
                      of fish other than sturgeon - e.g. salmon, carp, pike, tuna,
                      mullet, cod, lumpfish, which have been washed, cleaned and salted).
                      Can also be pressed, dried, seasoned and coloured.
                  01.1.3.3.9:
                    title: Other fish, prepared or preserved
                    includes:
                    - fish preparations n.e.c
              01.1.3.4:
                title: Other seafood, live, fresh, chilled or frozen
                tags:
                - ND
                includes:
                - crabs, lobsters, crayfish, krill, sea-spider, shrimps and prawns
                  and other crustaceans, live, fresh, chilled or frozen
