          01.1.9:
            title: Ready-made food and other food products n.e.c.
            tags:
            - ND
            children:
              01.1.9.1:
                title: Ready-made food
                tags:
                - ND
                intro: Prepared food and meals that can be eaten as is or after heating
                  but that do not require cooking. They contain mixed ingredients
                  and can be fresh, frozen or dehydrated/instant. They can include
                  sauces and dressing which, especially when food is fresh, can be
                  provided in separate bags. Disposable forks, knives, spoons or chopsticks
                  are sometimes also included in the package.
                includes:
                - 'pre-cooked dishes containing stuffed pasta, rice and other cereals,
                  such as: couscous dishes, including vegetables, and/or meat, fish,
                  cheese or other ingredients; ready to eat dumplings, ravioli, noodles
                  and similar, with sauce'
                - ready-made meals and dishes based on pre-cooked meat, meat substitutes
                  and/or on fish
                - TV dinners
                - composed salads and other prepared dishes and meals based on vegetables,
                  pulses and potatoes also including other ingredients, such as meat,
                  fish and cheese
                - sandwiches, pizzas, quiches, meat or fish pies, frozen or not
                - omelettes, crepes and other food products based on eggs when pre-cooked
                  and served as a main dish
                - ready-made soups including dehydrated and instant soups and stews
                - other prepared ready-made dishes and meals n.e.c
                excludes:
                - bread and bakery products, cakes (01.1.1.3)
                - macaroni, noodles, couscous and similar pasta products uncooked,
                  whether stuffed or not (01.1.1.5)
                - cheese (01.1.4.5) and yoghurt 01.1.4.6)
                - frozen, chipped potatoes (01.1.7.9)
                - ice cream (0.1.1.8.6) and other desserts n.e.c. (01.1.8.9)
                children:
                  01.1.9.1.1:
                    title: Pre-cooked dishes based on pasta and cereals
                    intro: Dishes can include vegetables, meat, fish, cheese, sauces
                      or other ingredients, provided that these are not the main ingredients.
                    includes:
                    - pre-cooked dishes in which the prevailing ingredient is pasta
                      (either stuffed or not)
                    - pre-cooked dishes in which the prevailing ingredient is rice,
                      quinoa, or other cereals
                    - couscous dishes
                    - ready to eat dumplings, ravioli and noodles
                  01.1.9.1.2:
                    title: Pre-cooked dishes based on meat and/or fish
                    intro: Pre-cooked dishes based on meat, meat substitutes and/or
                      fish as the prevailing ingredient; dishes can also include vegetables,
                      sauces or other ingredients, provided that these are not the
                      main ingredients.
                  01.1.9.1.3:
                    title: Composed salads and prepared dishes based on vegetables
                    intro: Composed salads and other prepared dishes and meals based
                      on vegetables as the prevailing ingredients. Pulses and potatoes
                      and other ingredients, such as meat, fish and cheese, can also
                      be included provided that they are not the main ingredients.
