              similar eating facilities either providing full, limited, or self-service.
            also_includes:
            - tobacco that is consumed with a shisha or hookah pipes in restaurants,
              cafés, or shisha lounges
            - narcotics purchased in coffee shops, if service charge is applied
            - tips and gratuities
            excludes:
            - food and beverage provided by supermarkets and markets and consumed
              at their premises (related products in Division 01)
            - food products and beverages dispensed by automatic vending machines
              not as a delivery service provided restaurants, cafés, buffets, bars,
              tearooms and similar facilities (01.1.9.1)
            - tobacco purchases (02.3.0)
            - food and beverage services on public transport, if not separately invoiced
              (07.3)
            - food and beverages delivery services, if separately invoiced (07.4.9.2)
            - dancing establishments and nightclubs entrance fees (09.4.6.1)
            - food and beverage services in establishments providing recreational,
              cultural, sporting or entertainment services, if not separately invoiced
              (09.4.6, 09.6.1.0, 09.6.2.0, 09.6.9.0)
            - food and beverage services provided in package holidays, if not separately
              invoiced (09.8.0.0)
            - food and beverage services provided by hotels or other lodging establishments,
              if not separately invoiced from accommodation (11.2)
