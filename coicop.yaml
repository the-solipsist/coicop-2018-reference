                includes:
                - independent tutors (private lessons to support formal education),
                  tutor centres, homework help centres and the like
                - exam preparation courses
                - online tutoring
              10.5.0.9:
                title: Other education not defined by level
                tags:
                - S
                includes:
                - educational programmes, generally for adults, which do not require
                  any special prior instruction, in particular vocational training
                  or cultural development
                - language immersion courses and international travels with educational
                  purposes (e.g. languages)
                - languages courses in classroom, online, in form of software or audio
                  tapes
                - language proficiency tests
                - information technology courses (e.g. learning how to use a specific
                  software)
                excludes:
                - driving lessons (07.2.4.3)
                - recreational training courses, such as sport or bridge lessons given
                  by independent teachers (09.4.6.1)
                - removable media containing foreign language trainers (09.7.1.1)
  '11':
    title: RESTAURANTS AND ACCOMMODATION SERVICES
    intro: 'Division 11 covers food and beverage serving services provided by restaurants,
      cafés and similar facilities, either with full, limited, or self-service, or
      by canteens, cafeterias or refectories at work or school and other educational
      establishment’s premises (11.1). The distinction between full service and limited
      service relates to the range of the food and beverage serving services: a service
      by waiters to the individual customer seated at tables will be qualified to
      be a full service._x000D_

      _x000D_

      Accommodation (11.2) in this Division includes services for visitors and other
      travellers away from their principal or secondary residence. If not separately
      invoiced, it also includes food and beverage services and other serving services,
      such as housekeeping, parking, laundry, swimming pools and exercise rooms, recreational
      facilities and conference and convention facilities.'
    excludes:
    - permanent principal or secondary residence accommodation (Division 04)
    children:
      '11.1':
        title: FOOD AND BEVERAGE SERVING SERVICES
