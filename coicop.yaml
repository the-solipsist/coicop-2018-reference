  '10':
    title: EDUCATION SERVICES
    intro: 'Division 10 covers educational services only. The focus of Groups 10.1
      to 10.4 is on formal education (that leads to degrees, certificates, or diplomas).
      It includes education by radio or TV broadcasting as well as e-learning and
      correspondence courses. It includes admission and registration fees as well
      as tuition fees._x000D_

      _x000D_

      It also includes other education related fees, such as camps and field trips,
      course fees, diploma fees, examination fees, graduation fees, laboratory fees,
      physical education fees, capital assessment fees, etc._x000D_

      _x000D_

      The breakdown of educational services is based upon the level categories of
      the 2011 revision of the International Standard Classification of Education
      (ISCED 2011) of the United Nations Educational, Scientific and Cultural Organization
      (UNESCO)._x000D_

      _x000D_

      This Division does not include expenditures on other education related goods
      and services, such as:_x000D_

      - school uniforms (03.1.2.4);_x000D_

      - education support services, such as health-care services (06);_x000D_

      - transport services except in the case of excursions which are part of the
      normal school programme (07.3.2.3);_x000D_

      - text books and academic journals (09.7.1.1);_x000D_

      - stationery (09.7.4.0);_x000D_

      - catering services (11.1.2.1);_x000D_

      - accommodation services (11.2.0.3).'
    children:
      '10.1':
        title: EARLY CHILDHOOD AND PRIMARY EDUCATION
        children:
          10.1.0:
            title: Early childhood and primary education
            tags:
            - S
            includes:
            - levels 0 and 1 of ISCED 2011 Early childhood and primary education
            - literacy programmes for students too old for primary school
            - education services for children with special educational needs
            also_includes:
            - excursions which are part of the normal school programme (travel and
              accommodation costs)
            excludes:
            - child care services without educational programme (13.3.0.1)
            children:
              10.1.0.1:
                title: Early childhood education
                tags:
                - S
                includes:
                - 'level 0 of ISCED 2011: Early childhood education is designed primarily
                  to support children’s early cognitive, physical, social and emotional
                  development and introduce very young children to organized instruction
                  outside of the family context. Programmes are designed for children
                  below the entry age to primary education and are typically centre
                  or school-based. This education may also be provided in hospitals
                  or in special schools or training centres'
                - special education services for children with special educational
                  needs
                also_includes:
                - excursions which are part of the normal school programme (travel
                  and accommodation costs)
                excludes:
                - child care services without educational programme (13.3.0.1)
              10.1.0.2:
                title: Primary education
                tags:
                - S
                includes:
                - 'level 1 of ISCED 2011: Primary education usually begins at age
                  5, 6 or 7 and generally lasts for 4 to 7 years. Programmes are normally
                  designed to provide students with fundamental skills in reading,
                  writing and mathematics and establish a solid foundation for learning
                  and understanding core areas of knowledge and personal and social
                  development'
                - organized instruction for children with special needs and literacy
                  or basic skills programmes within or outside the school system which
                  are similar in content to programme in primary education
                - literacy programmes for students too old for primary school
                - excursions which are part of the normal school programme (travel
                  and accommodation costs)
      '10.2':
        title: SECONDARY EDUCATION
        children:
          10.2.0:
            title: Secondary education
            tags:
            - S
            includes:
            - 'levels 2 and 3 of ISCED 2011: lower-secondary and upper-secondary education.
              Secondary education is designed to lay the foundation for lifelong learning
              and human development and to provide the skills and knowledge needed
              either for further studies at post-secondary and tertiary levels or
              for entry to the labour market, or both. Programmes are increasingly
              subject oriented and specialized. Different study options or streams
              are offered, including vocational education and training'
            - secondary education for adults and young people including second chance
              or reintegration; programmes
            - out-of-school secondary education for adults and young people
            - education services for adolescents with special educational needs
            also_includes:
            - excursions or student exchanges which are part of the normal school
              programme (travel and accommodation costs)
            children:
              10.2.0.0:
                title: Secondary education
                tags:
                - S
                includes:
                - 'levels 2 and 3 of ISCED 2011: lower-secondary and upper-secondary
                  education. Secondary education is designed to lay the foundation
                  for lifelong learning and human development and to provide the skills
                  and knowledge needed either for further studies at post-secondary
                  and tertiary levels or for entry to the labour market, or both.
                  Programmes are increasingly subject oriented and specialized. Different
                  study options or streams are offered, including vocational education
                  and training'
                - secondary education for adults and young people including second
                  chance or reintegration; programmes
                - out-of-school secondary education for adults and young people
                - education services for adolescents with special educational needs
                also_includes:
                - excursions or student exchanges which are part of the normal school
                  programme (travel and accommodation costs)
      '10.3':
        title: POST-SECONDARY NON-TERTIARY EDUCATION
        children:
          10.3.0:
            title: Post-secondary non-tertiary education
            tags:
            - S
            includes:
            - 'level 4 of ISCED 2011: Post-secondary non-tertiary education provides
              learning experiences building on secondary education, preparing for
              labour market entry as well as tertiary education. It aims at the individual
              acquisition of knowledge, skills and competencies lower than the level
              of complexity characteristic of tertiary education. Post-secondary non-tertiary
              education is typically designed to provide individuals who completed
              upper secondary education without qualifications required for progression
              to tertiary education and/or for individuals seeking specific types
              of employment when their secondary qualification does not grant such
              access. For example, graduates from general secondary programmes may
              choose to complete a non-tertiary vocational qualification; or graduates
              from vocational secondary programmes may choose to increase their level
              of qualifications or specialize further. Usually programmes at this
              level are designed for direct labour market entry. General programmes
              designed to give access to or improved access to tertiary education
              can also exist'
            - out-of-school post-secondary non-tertiary education for adults and young
              people
            - education services for young people and adults with special educational
              needs
            also_includes:
            - excursions or student exchanges which are part of the normal school
              programme (travel and accommodation costs)
            children:
              10.3.0.0:
                title: Post-secondary non-tertiary education
                tags:
                - S
                includes:
                - 'level 4 of ISCED 2011: Post-secondary non-tertiary education provides
                  learning experiences building on secondary education, preparing
                  for labour market entry as well as tertiary education. It aims at
                  the individual acquisition of knowledge, skills and competencies
                  lower than the level of complexity characteristic of tertiary education.
                  Post-secondary non-tertiary education is typically designed to provide
                  individuals who completed upper secondary education without qualifications
                  required for progression to tertiary education and/or for individuals
                  seeking specific types of employment when their secondary qualification
                  does not grant such access. For example, graduates from general
                  secondary programmes may choose to complete a non-tertiary vocational
                  qualification; or graduates from vocational secondary programmes
                  may choose to increase their level of qualifications or specialize
                  further. Usually programmes at this level are designed for direct
                  labour market entry. General programmes designed to give access
                  to or improved access to tertiary education can also exist'
                - out-of-school post-secondary non-tertiary education for adults and
                  young people
                - education services for young people and adults with special educational
                  needs
                also_includes:
                - excursions or student exchanges which are part of the normal school
                  programme (travel and accommodation costs)
      '10.4':
        title: TERTIARY EDUCATION
        children:
          10.4.0:
            title: Tertiary education
            tags:
            - S
            includes:
            - 'levels 5, 6, 7 and 8 of ISCED 2011: tertiary education builds on secondary
              education and provides learning activities in specialized fields of
              education. It aims at a high level of complexity and specialization.
              It includes both academic education and advanced vocational or professional
              education. At the highest levels, programmes lead to an advanced research
              qualification based on advanced study and original research'
            also_includes:
            - excursions or student exchanges which are part of the normal school
              programme (travel and accommodation costs)
            - university admission tests
            - e-learning courses
            children:
              10.4.0.0:
                title: Tertiary education
                tags:
                - S
                includes:
                - 'levels 5, 6, 7 and 8 of ISCED 2011: tertiary education builds on
                  secondary education and provides learning activities in specialized
                  fields of education. It aims at a high level of complexity and specialization.
                  It includes both academic education and advanced vocational or professional
                  education. At the highest levels, programmes lead to an advanced
                  research qualification based on advanced study and original research'
                also_includes:
                - excursions or student exchanges which are part of the normal school
                  programme (travel and accommodation costs)
                - university admission tests
                - e-learning courses
      '10.5':
        title: EDUCATION NOT DEFINED BY LEVEL
        children:
          10.5.0:
            title: Education not defined by level
            tags:
            - S
            includes:
            - independent tutors (private lessons), tutor centres, homework help centres
              and the like
            - short educational courses, generally for adults, which do not require
              any special prior instruction, in particular cultural development or
              some types of vocational training
            - language immersion courses and international travel for learning languages
