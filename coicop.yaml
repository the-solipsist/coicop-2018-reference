                - parts of footwear, such as heels, soles, etc., purchased by households
                  with the intention of undertaking the repair themselves (03.2.1)
                - polishes, creams and other shoe-cleaning articles (05.6.1.1)
                - hire and repair of game-specific footwear (ski boots, football boots,
                  golfing shoes and other such footwear fitted with ice-skates, rollers,
                  spikes, studs, etc.) (09.4.4.0)
  '04':
    title: HOUSING, WATER, ELECTRICITY, GAS AND OTHER FUELS
    intro: 'Division 04 covers goods and services for the use of the house or dwelling,
      its maintenance and repair, the supply of water and miscellaneous services related
      to the dwelling and energy used for heating or cooling. Actual rentals and imputed
      rentals (according to national accounts (SNA 2008)) for main or secondary residences
      are classified in Groups 04.1 and 04.2, respectively._x000D_

      _x000D_

      Maintenance, repair and security of the dwelling include materials for repair
      purchased with the intention of undertaking the repair and maintenance themselves,
      as well as the repair services purchased from enterprises. It should be noted
      that only expenditures on materials and services for minor repairs are covered
      by Group 04.3. Expenditures on materials and services for major maintenance
      and repair are not part of individual consumption expenditures of households
      and are thus out of scope of the classification. This refers especially to owner-occupiers;
      tenants will not make such expenditures on major maintenance and repair at all
      as they are not the owner of the dwelling.'
    children:
      '04.1':
        title: ACTUAL RENTALS FOR HOUSING
        intro: 'Rentals normally include payment for the use of the land on which
          the property stands, the dwelling occupied, the fixtures and fittings for
          heating, plumbing, lighting, etc., and, in the case of a dwelling let furnished,
          the furniture._x000D_

          _x000D_

          Rentals also include payment for the use of a garage to provide parking
          in connection with the dwelling._x000D_

          _x000D_

          The garage does not have to be physically contiguous to the dwelling; nor
          does it have to be leased from the same landlord._x000D_

          _x000D_

          Rentals do not include payment for the use of garages or parking spaces
          not providing parking in connection with the dwelling (07.2.4). Nor do they
          include charges for water supply (04.4.1), refuse collection (04.4.2) and
          sewage collection (04.4.3); co-proprietor charges for caretaking, gardening,
          stairwell cleaning, heating and lighting, maintenance of lifts and refuse
          disposal chutes, etc. in multi-occupied buildings (04.4.4); charges for
          electricity (04.5.1) and gas (04.5.2); charges for heating and hot water
          supplied by district heating plants (04.5.5)._x000D_

          _x000D_

          Each household has a principal dwelling (sometimes also designated as main
          or primary home), usually defined with reference to time spent there, whose
          location defines the country of residence and place of usual residence of
          this household and of all its members. All other dwellings (owned or leased
          by the household) are considered secondary dwellings.'
        includes:
        - rentals actually paid by tenants or subtenants occupying unfurnished or
          furnished premises as their main residence
        also_includes:
        - payments by households occupying a room in a hotel or boarding house as
          their main residence
        excludes:
        - accommodation services of educational establishments and hostels (11.2.0.9)
        - retirement homes for elderly persons (13.3.0.2)
        children:
          04.1.1:
            title: Actual rentals paid by tenants for main residence
            tags:
            - S
            includes:
            - rentals actually paid by tenants or subtenants occupying unfurnished
              or furnished premises as their main residence
            also_includes:
            - payments by households occupying a room in a hotel or boarding house
              as their main residence
            excludes:
            - garage rentals to provide parking and storage in connection with the
              dwelling (04.1.2.2)
            - accommodation services of educational establishments and hostels (11.2.0.9)
            - retirement homes for elderly persons (13.3.0.2)
            children:
              04.1.1.0:
                title: Actual rentals paid by tenants for main residence
                tags:
                - S
                includes:
                - rentals actually paid by tenants or subtenants occupying unfurnished
                  or furnished premises as their main residence
                also_includes:
                - payments by households occupying a room in a hotel or boarding house
                  as their main residence
                excludes:
                - garage rentals to provide parking and storage in connection with
                  the dwelling (04.1.2.2)
                - accommodation services of educational establishments and hostels
                  (11.2.0.9)
                - retirement homes for elderly persons (13.3.0.2)
          04.1.2:
            title: Other actual rentals
            tags:
            - S
            includes:
            - rentals actually paid for secondary residences
            - rentals of self-storage units
            - garage rentals
            excludes:
            - accommodation services of holiday villages and holiday centres (11.2.0.2)
            children:
              04.1.2.1:
                title: Actual rentals paid by tenants for secondary residences
                tags:
                - S
                includes:
                - rentals actually paid for secondary residences
                excludes:
                - accommodation services of holiday villages and holiday centres (11.2.0.2)
              04.1.2.2:
                title: Garage rentals and other rentals paid by tenants
                tags:
                - S
                intro: Rental payments for the use of a garage to provide parking
                  and storage in connection with the dwelling. The garage or storage
                  does not have to be physically contiguous to the dwelling, nor does
                  it have to be leased from the same landlord.
                includes:
                - garage rentals in connection with the dwelling
                - rentals of self-storage units
                excludes:
                - payment for the use of garages or parking spaces not providing parking
                  in connection with the dwelling (07.2.4.1)
                - (long-term) storage of furniture and other personal effects (07.4.9.1)
      '04.2':
        title: IMPUTED RENTALS FOR HOUSING
        intro: 'Persons who own the dwellings in which they live are treated as owning
          unincorporated enterprises that produce housing services that are consumed
          by the household to which the owner belongs. The housing services produced
          are deemed to be equal in value to the rentals that would be paid on the
          market for accommodation of the same size, quality and type. The imputed
          values of the housing services are recorded as final consumption expenditures
          of the owners. Imputed rentals normally include value for the use of the
          land on which the property stands, the dwelling occupied, and the fixtures
          and fittings for heating, plumbing, lighting, etc._x000D_

          _x000D_

          Imputed rentals also include the use of a garage to provide parking in connection
          with the dwelling. The garage does not have to be physically contiguous
          to the dwelling._x000D_

          _x000D_

          Imputed rentals do not include payment for the use of garages or parking
          spaces not providing parking in connection with the dwelling (07.2.4). Nor
          do they include charges for water supply (04.4.1), refuse collection (04.4.2)
          and sewage collection (04.4.3); co-proprietor charges for caretaking, gardening,
          stairwell cleaning, heating and lighting, maintenance of lifts and refuse
          disposal chutes, etc. in multi-occupied buildings (04.4.4); charges for
          electricity (04.5.1) and gas (04.5.2); charges for heating and hot water
          supplied by district heating plants (04.5.5).'
        children:
          04.2.1:
            title: Imputed rentals of owner-occupiers for main residence
            tags:
            - S
            includes:
            - imputed rentals of owners occupying their main residence
            children:
              04.2.1.0:
                title: Imputed rentals of owner-occupiers for main residence
                tags:
                - S
                includes:
                - imputed rentals of owners occupying their main residence
          04.2.2:
            title: Other imputed rentals
            tags:
            - S
            includes:
            - imputed rentals for secondary residences
            - imputed garage rentals in connection with the dwelling
            - imputed rentals of storage units
            children:
              04.2.2.0:
                title: Other imputed rentals
                tags:
                - S
                includes:
                - imputed rentals for secondary residences
                - imputed garage rentals in connection with the dwelling
                - imputed rentals of storage units
      '04.3':
        title: MAINTENANCE, REPAIR AND SECURITY OF THE DWELLING
        intro: 'Maintenance and repair of dwellings are distinguished by two features:
          first, they are activities that have to be undertaken regularly in order
          to maintain the dwelling in good working order; second, they do not change
          the dwelling’s performance, capacity or expected service life._x000D_

          _x000D_

          There are two types of maintenance and repair of dwellings: those which
          are minor, such as interior decoration and repairs to fittings, and which
          are commonly carried out by both tenants and owners; and those which are
          major, such as replastering walls or repairing roofs, and which are carried
          out by owners only._x000D_

          _x000D_

          Only expenditures which tenants and owner-occupiers incur on materials and
          services for minor maintenance and repair are part of individual consumption
          expenditure of households._x000D_

          _x000D_

          Expenditures which owner-occupiers incur on materials and services for major
          maintenance and repair are not part of individual consumption expenditure
          of households._x000D_

          _x000D_

          Purchases of materials made by tenants or owner-occupiers with the intention
          of undertaking the maintenance or repair themselves should be shown under
          Class 04.3.1. If tenants or owner occupiers pay an enterprise to carry out
          the maintenance or repair, the total value of the service, including the
          costs of the materials used, should be shown under Class 04.3.2 unless the
          materials are separately invoiced.'
        children:
          04.3.1:
            title: Security equipment and materials for the maintenance and repair
              of the dwelling
            tags:
            - ND
            includes:
            - products and materials, such as paints and varnishes, renderings, wallpapers,
              fabric wall coverings, window panes, plaster, cement, putty, wallpaper
              pastes, etc., purchased for minor maintenance and repair of the dwelling
            - small plumbing items (pipes, taps, joints, etc.), surfacing materials
              (floorboards, ceramic tiles, etc.) and brushes and scrapers for paint,
              varnish and wallpaper
            - fitted carpets and linoleum
            - door fittings, power sockets, wiring flex
            - small equipment for surveillance/security for the individual dwelling
            - door phones for dwellings
            - fire extinguishers
            excludes:
            - hand tools (05.5.2.1)
            - lamp bulbs (05.5.2.2)
            - brooms, scrubbing brushes, dusting brushes and cleaning products (05.6.1.1)
            - fire extinguishers for transport equipment (07.2.1.3)
            - products, materials and fixtures used for major maintenance and repair
              (intermediate consumption) or for extension and conversion of the dwelling
              (capital formation)
            children:
              04.3.1.1:
                title: Materials for the maintenance and repair of the dwelling
                tags:
                - ND
                includes:
                - products and materials, such as paints and varnishes, renderings,
                  wallpapers, fabric wall coverings, window panes, plaster, cement,
                  putty, wallpaper pastes, etc., purchased for minor maintenance and
                  repair of the dwelling
                - small plumbing items (pipes, taps, joints, etc.), surfacing materials
                  (floorboards, ceramic tiles, etc.) and brushes and scrapers for
                  paint, varnish and wallpaper
                - fitted carpets and linoleum
                - door fittings, power sockets, wiring flex
                excludes:
                - hand tools (05.5.2.1)
                - lamp bulbs (05.5.2.2)
                - brooms, scrubbing brushes, dusting brushes and cleaning products
                  (05.6.1.1)
                - products, materials and fixtures used for major maintenance and
                  repair (intermediate consumption) or for extension and conversion
                  of the dwelling (capital formation)
              04.3.1.2:
                title: Security equipment
                tags:
                - SD
                includes:
                - small equipment for surveillance/security for the individual dwelling
                  (smoke detector, security alarms, security/surveillance cameras)
                - door phones for dwellings
                - fire extinguishers
                excludes:
                - fire extinguishers for transport equipment (07.2.1.3)
          04.3.2:
            title: Services for the maintenance, repair and security of the dwelling
            tags:
            - S
            intro: The cost of materials is included only if the materials are not
