  '12':
    title: INSURANCE AND FINANCIAL SERVICES
    intro: 'Division 12 covers insurance (12.1) and financial services (12.2). Insurance
      and financial services are provided by financial corporations. These may be
      paid for explicitly or implicitly. Some transactions in financial assets may
      also involve both explicit and implicit charges. Implicit charges are not always
      as evident as the way in which charges are made for most goods and services
      and are typically calculated using a number of observable transactions. Examples
      of implicit charges arise from the financial services provided in association
      with interest charges on loans and deposits, the acquisition and disposal of
      financial assets and liabilities in financial markets, and insurance and pension
      schemes. The imputed values of expenditure on insurance and financial services
      are not directly observable from household income and expenditure surveys._x000D_

      _x000D_

      Insurance services are subdivided by type of insurance. Financial services are
      subdivided by financial intermediation services indirectly measured and by the
      other forms of actual and indirect charges and remittance fees for financial
      services. For the definition and the measurement of the insurance and financial
      services specific national accounts concepts (2008 SNA) do apply.'
    children:
      '12.1':
        title: INSURANCE
        intro: 'Service charges for insurance are classified by type of insurance,
          namely: life insurance and non-life insurance (that is, insurance in connection
          with the dwelling, health, transport, etc.). Service charges for multi-risk
          insurance covering several risks should be classified on the basis of the
          cost of the principal risk if it is not possible to allocate the service
          charges to the various risks covered._x000D_

          _x000D_

          The basic method for measuring the service charge for non-life insurance
          is total premiums earned plus investment income earned from investing the
          premiums less adjusted claims incurred._x000D_

          _x000D_

          The basic method for measuring the service charge for life insurance is
          premiums earned plus investment income earned from investing the premiums
          less benefits due less increases (plus decreases) in life insurance technical
          reserves.'
        children:
          12.1.1:
            title: Life and accident insurance
            tags:
            - S
            includes:
            - service charges for life insurance, annuities, death benefit insurance,
              education insurance, etc
            children:
              12.1.1.0:
                title: Life and accident insurance
                tags:
                - S
                includes:
                - service charges for life insurance, annuities, death benefit insurance,
                  education insurance, etc
                also_includes:
                - service charges for funeral insurance
                - service charges for accident insurance
          12.1.2:
