    <title>COICOP 2018 - Classification</title>
    <style>
        :root {
            --toc-width: 380px;
            --link-color: #0066cc;
            --link-hover: #004499;
            --bg-color: #fff;
            --border-color: #e9ecef;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            color: #333;
            margin: 0;
            padding: 0;
            background: #fff;
        }
        a { color: var(--link-color); text-decoration: none; }
        a:hover { text-decoration: underline; color: var(--link-hover); }
        
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #fff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 200;
        }
        .top-nav h1 { margin: 0; font-size: 1.2rem; font-weight: 600; }
        .top-nav .nav-links { margin-left: 30px; display: flex; gap: 20px; }
        .top-nav .nav-links a { font-size: 0.95rem; color: #555; font-weight: 500; }
        .top-nav .nav-links a:hover { color: var(--link-color); }
        .top-nav .nav-links a.active { color: var(--link-color); border-bottom: 2px solid var(--link-color); padding-bottom: 18px; margin-bottom: -20px; }
        
        .top-nav .downloads { margin-left: auto; display: flex; gap: 10px; align-items: center; }
        .top-nav .downloads span { font-size: 0.85rem; color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .top-nav .downloads a {
            font-size: 0.8rem;
            color: #444;
            border: 1px solid #ccc;
            padding: 4px 8px;
            border-radius: 4px;
            background: #f8f9fa;
        }
        .top-nav .downloads a:hover {
            background: #e9ecef;
            color: #000;
            border-color: #999;
            text-decoration: none;
        }
        
        .toc-sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: var(--toc-width);
            height: calc(100vh - 60px);
            background: #fafafa;
            border-right: 1px solid var(--border-color);
            padding: 15px 0 0 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }
        
        #toc-container {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 15px;
        }
        
        .level-filter {
            padding: 0 15px 15px 15px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #666;
        }
        .level-filter select { padding: 3px 6px; font-size: 0.85rem; border: 1px solid #ccc; border-radius: 3px; }
        
        .toc-sidebar h2 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            padding: 0 15px;
            margin: 0 0 10px 0;
        }
        
        .toc-list { list-style: none; padding: 0; margin: 0; }
        .toc-list .toc-list { padding-left: 15px; display: none; }
        .toc-item.expanded > .toc-list { display: block; }
        
        .toc-row { 
            display: flex; 
            align-items: flex-start; 
            padding: 4px 10px 4px 5px; 
            border-left: 3px solid transparent;
        }
        .toc-row:hover { background: #f0f0f0; }
        .toc-row.active { background: #e6f0ff; border-left-color: #0066cc; }
        .toc-row.active .toc-link { color: #0066cc; font-weight: 500; }
        
        .toc-toggle { 
            cursor: pointer; 
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            width: 20px; 
            height: 20px;
            font-size: 0.65rem; 
            color: #666; 
            user-select: none; 
            transition: transform 0.2s; 
            flex-shrink: 0;
            margin-right: 2px;
            border-radius: 3px;
        }
        .toc-toggle:hover { background: #e0e0e0; color: #000; }
        .toc-item.expanded > .toc-row > .toc-toggle { transform: rotate(90deg); }
        .toc-toggle-empty { display: inline-block; width: 22px; flex-shrink: 0; }
        
        .toc-link { 
            display: flex; 
            text-decoration: none; 
            color: #444; 
            flex: 1; 
            align-items: baseline; 
            gap: 8px;
            cursor: pointer;
        }
        .toc-link .code { font-family: monospace; font-size: 0.85rem; color: #666; flex-shrink: 0; }
        .toc-link .title { font-size: 0.85rem; line-height: 1.3; }
        
        .main-content {
            margin-left: var(--toc-width);
            margin-top: 60px;
            padding: 30px 50px;
            max-width: 1000px;
        }
        
        .content-item { margin-bottom: 30px; padding-top: 20px; scroll-margin-top: 80px; }
        
        .content-item h2 { margin: 0 0 10px 0; font-size: 1.8rem; font-weight: 700; color: #111; }
        .content-item h2 .code { font-weight: normal; color: #666; font-size: 1.3rem; margin-left: 10px; font-family: monospace; }
        
        .content-item h3 { margin: 25px 0 10px 0; font-size: 1.5rem; font-weight: 600; color: #222; }
        .content-item h3 .code { font-weight: normal; color: #666; font-size: 1.1rem; margin-left: 10px; font-family: monospace; }
        
        .content-item h4 { margin: 20px 0 8px 0; font-size: 1.3rem; font-weight: 600; color: #333; }
        .content-item h4 .code { font-weight: normal; color: #666; font-size: 1rem; margin-left: 8px; font-family: monospace; }

        .content-item h5 { margin: 15px 0 6px 0; font-size: 1.15rem; font-weight: 600; color: #444; }
        .content-item h5 .code { font-weight: normal; color: #666; font-size: 0.95rem; margin-left: 8px; font-family: monospace; }

        .content-item h6 { margin: 15px 0 6px 0; font-size: 1.05rem; font-weight: 600; color: #555; }
        .content-item h6 .code { font-weight: normal; color: #666; font-size: 0.9rem; margin-left: 8px; font-family: monospace; }
        
        .content-description { margin: 8px 0 15px 0; color: #444; line-height: 1.6; white-space: pre-line; }
        
        .collapsible { margin: 8px 0; }
        .collapsible summary {
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            color: #555;
            outline: none;
            padding: 3px 0;
        }
        .collapsible summary:hover { color: #333; }
        .collapsible[open] summary { margin-bottom: 5px; }
        .collapsible .includes { color: #2e7d32; }
        .collapsible .excludes { color: #c62828; }
        .collapsible ul { margin: 5px 0; padding-left: 20px; }
        .collapsible li { margin-bottom: 3px; font-size: 0.9rem; }
        
        @media (max-width: 900px) {
            .toc-sidebar { display: none; }
            .main-content { margin-left: 0; padding: 20px; }
            .top-nav { padding: 0 10px; }
            .top-nav .nav-links { margin-left: 10px; gap: 10px; }
            .top-nav .downloads { display: none; }
        }
    </style>

the 2008 System of National Accounts are classified to groups 04.1 and 04.2, respectively.\n\nDwelling maintenance, repair and security includes, under group 04.3, materials purchased by tenants and owner-occupiers with the intention of undertaking maintenance and repair themselves, as well as the services for the maintenance, repair and security of the dwelling purchased from enterprises. It should be noted that only expenditures on materials and services intended for minor maintenance and repairs are covered under group 04.3:  expenditures on materials and services for major maintenance and repair - which are usually the responsibility of a landlord rather than of tenants - are not considered part of individual consumption expenditures of households and are thus out of scope of the classification.", "children": [{"code": "04.1", "title": "Actual rental payments made for housing", "intro": "Rentals normally include payment for the use of the land on which the property stands; the dwelling occupied; the fixtures and fittings for heating, plumbing, lighting and so on; and, in the case of a dwelling that is let furnished, the furniture.\n\nRentals also include payment for the use of a garage that provides parking in connection with the dwelling. However, the garage does not need to be physically contiguous to the dwelling nor does it have to be leased from the same landlord.\n\nRentals do not include payment for the use of a garage or parking space that provides parking not in connection with the dwelling (07.2.4). Nor do they include charges for water supply (04.4.1), refuse collection (04.4.2) or sewage collection (04.4.3); co-proprietor charges for caretaking, gardening, stairwell cleaning, heating and lighting, maintenance of lifts and refuse disposal chutes and so on, in multi-occupied buildings (04.4.4); charges for electricity (04.5.1) and gas (04.5.2); or charges for heating and hot water (04.5.3, 04.5.4) supplied by district heating plants (04.5.5).\n\nEvery household has a principal dwelling (sometimes designated as the main or primary home), which is usually determined on the basis of the amount of time spent there whose location defines the country of residence and place of usual residence of the household and all of its members. All other homes owned or leased by the household are considered secondary dwellings.", "includes": ["rentals actually paid by tenants or subtenants occupying furnished or unfurnished premises as their main residence"], "alsoIncludes": ["payments by households occupying a room in a hotel or boarding house as their main residence"], "excludes": ["accommodation services of boarding schools, universities and other educational establishments (11.2.0.3)", "accommodation services of hostels for workers (11.2.0.9)", "retirement homes for elderly persons (13.3.0.2)"], "children": [{"code": "04.1.1", "title": "Actual rental payments made by tenants for main residence", "includes": ["rentals actually paid by tenants or subtenants occupying furnished or unfurnished premises as their main residence"], "alsoIncludes": ["payments by households occupying a room in a hotel or boarding house as their main residence"], "excludes": ["rentals paid for use of a garage that provides parking and storage in connection with a dwelling (04.1.2.2)", "accommodation services of boarding schools, universities and other educational establishments (11.2.0.3)", "accommodation services of hostels for workers (11.2.0.9)", "retirement homes for elderly persons (13.3.0.2)"], "tags": ["S"], "children": [{"code": "04.1.1.0", "title": "Actual rental payments made by tenants for main residence", "includes": ["rentals actually paid by tenants or subtenants occupying furnished or unfurnished premises as their main residence"], "alsoIncludes": ["payments by households occupying a room in a hotel or boarding house as their main residence"], "excludes": ["rental paid for use of a garage that provides parking and storage but not in connection with a dwelling (04.1.2.2)", "accommodation services of boarding schools, universities and other educational establishments (11.2.0.3)", "accommodation services of hostels for workers (11.2.0.9)", "retirement homes for elderly persons (13.3.0.2)"], "tags": ["S"]}]}, {"code": "04.1.2", "title": "Other actual rental payments", "includes": ["rentals actually paid for secondary residences", "rentals of self", "storage units", "garage rentals"], "excludes": ["accommodation services of holiday villages and holiday centres (11.2.0.2)"], "tags": ["S"], "children": [{"code": "04.1.2.1", "title": "Actual rental payments made by tenants for secondary residences", "includes": ["rentals actually paid for secondary residences"], "excludes": ["accommodation services of holiday villages and holiday centres (11.2.0.2)"], "tags": ["S"]}, {"code": "04.1.2.2", "title": "Garage rental payments and other rental payments made by tenants", "intro": "Rental payments for the use of a garage that provides parking and/or storage in connection with a dwelling. The garage or storage facility does not have to be physically contiguous to the dwelling, nor does it have to be leased from the same landlord.", "includes": ["garage rentals in connection with the dwelling", "rentals of self", "storage units"], "excludes": ["payment for the use of a parking space or a garage that provides parking but not in connection with a dwelling (07.2.4.1)", "removal and storage services (07.4.9.1)"], "tags": ["S"]}]}]}, {"code": "04.2", "title": "Imputed rental payments for housing", "intro": "Persons who own the dwellings in which they live are treated as the owners of unincorporated enterprises producing housing services that are consumed by the household of which the owner is a member. The housing services produced are deemed to be equal in value to the rentals that would be paid on the market for accommodation of the same size, quality and type; and the imputed values of those services are recorded as final consumption expenditures of the owners. \n\nImputed rentals normally include values for the use of the land on which the property stands, the dwelling occupied, and the fixtures and fittings for heating, plumbing, lighting and so on. Imputed rentals also include payment for the use of a garage that provides parking in connection with the dwelling but does not have to be physically contiguous to the dwelling.\n\nImputed rentals do not include payment for the use of garages or parking spaces that provide parking not in connection with the dwelling (07.2.4). Nor do they include charges for water supply (04.4.1), refuse collection (04.4.2) or sewage collection (04.4.3); co-proprietor charges for caretaking, gardening, stairwell cleaning, heating and lighting, maintenance of lifts and refuse disposal chutes, etc. in multi-occupied buildings (04.4.4); charges for electricity (04.5.1) and gas (04.5.2); or charges for heating and hot water (04.5.3, 04.5.4) supplied by district heating plants (04.5.5).", "children": [{"code": "04.2.1", "title": "Imputed rental payments of owner-occupiers for their main residence", "includes": ["imputed rentals of owners occupying their main residence"], "tags": ["S"], "children": [{"code": "04.2.1.0", "title": "Imputed rental payments of owner-occupiers for their main residence", "includes": ["imputed rentals of owners occupying their main residence"], "tags": ["S"]}]}, {"code": "04.2.2", "title": "Other imputed rentals", "includes": ["imputed rentals for secondary residences", "imputed garage rentals in connection with the dwelling", "imputed rentals of storage units"], "tags": ["S"], "children": [{"code": "04.2.2.0", "title": "Other imputed rentals", "includes": ["imputed rentals for secondary residences", "imputed garage rentals in connection with the dwelling", "imputed rentals of storage units"], "tags": ["S"]}]}]}, {"code": "04.3", "title": "Maintenance, repair and security of the dwelling", "intro": "Maintenance and repair of dwellings are activities that are distinguished by two features: first, they have to be undertaken regularly if the dwelling is to remain in good working order; second, they do not change the dwelling's performance, capacity or expected service life.\n\nThere are two types of maintenance and repair of dwellings: those that are minor, such as interior decoration and repair to fittings and that are commonly carried out by both tenants and owner-occupiers, or major, such as replastering walls or repairing roofs, which are carried out only by owners.\n\nOnly the expenditures incurred by tenants and owner-occupiers on materials and services related to interior decoration and to other such minor maintenance and repair, which would normally be seen as the responsibility of a tenant, are considered part of the individual consumption expenditure of households.\n\nExpenditure incurred by owners, including owner-occupiers, on dwelling-related interior decoration and minor maintenance and repair that would normally be seen as the responsibility of a landlord, are considered intermediate expenditure and should not be treated as final consumption expenditure of households. Expenditure incurred by owners, including owner-occupiers, on major maintenance and repair are seen as gross fixed capital formation and thus also outside the scope of COICOP.\n\nMaterials purchased by tenants or owner-occupiers with the intention of undertaking minor maintenance or repair themselves should be assigned to subclass 04.3.1.1. If tenants or owner-occupiers pay an enterprise to carry out the minor maintenance or repair, the total value of the services, including the costs of the materials used, should be assigned to subclass 04.3.2.0. However, the cost of the materials should be assigned to 04.3.1.1 if they are separately priced.", "children": [{"code": "04.3.1", "title": "Security equipment and materials for dwelling maintenance and repair", "includes": ["products and materials such as paints and varnishes, renderings, wallpapers, fabric wall coverings, windowpanes, plaster, cement, putty, wallpaper pastes, etc., purchased for minor maintenance and repair of the dwelling", "small plumbing items (pipes, taps, joints, etc.), surfacing materials (floorboards, ceramic tiles, etc.) and brushes and scrapers for paint, varnish and wallpaper", "fitted carpets and linoleum", "door fittings, power sockets and wiring flex", "small surveillance and security equipment for individual dwellings", "door phones for dwellings", "fire extinguishers"], "excludes": ["hand tools (05.5.2.1)", "lamp bulbs (05.5.2.2)", "brooms, scrubbing brushes, dusting brushes and cleaning products (05.6.1.1)", "fire extinguishers for transport equipment (07.2.1.3)", "products, materials and fixtures used for major maintenance and repair (intermediate consumption) or for extension and conversion of the dwelling (capital formation)"], "children": [{"code": "04.3.1.1", "title": "Materials for the maintenance and repair of the dwelling", "includes": ["products and materials such as paints and varnishes, renderings, wallpapers, fabric wall coverings, windowpanes, plaster, cement, putty, wallpaper pastes and so on, purchased for minor maintenance and repair of dwellings", "small plumbing items (pipes, taps, joints, etc.), surfacing materials (floorboards, ceramic tiles, etc.) and brushes and scrapers for paint, varnish and wallpaper", "fitted carpets and linoleum", "door fittings, power sockets and wiring flex"], "excludes": ["hand tools (05.5.2.1)", "lamp bulbs (05.5.2.2)", "brooms, scrubbing brushes, dusting brushes and cleaning products (05.6.1.1)", "products, materials and fixtures used for major maintenance and repair (intermediate consumption) or for extension and conversion of the dwelling (capital formation)"], "tags": ["ND"]}, {"code": "04.3.1.2", "title": "Security equipment", "includes": ["small surveillance and security equipment for individual dwellings (smoke detectors, security alarms, and security and surveillance cameras)", "door phones for dwellings", "fire extinguishers"], "excludes": ["fire extinguishers for transport equipment (07.2.1.3)"], "tags": ["SD"]}]}, {"code": "04.3.2", "title": "Services for the maintenance, repair and security of the dwelling", "intro": "The cost of materials is included only if the materials are not separately priced.", "includes": ["services of plumbers, electricians, carpenters, glaziers, painters, decorators, floor polishers, etc., engaged to carry out minor maintenance and repair of dwellings", "locksmith services", "services related to laying of fitted carpets and linoleum", "security services"], "excludes": ["separate purchases of materials by households with the intention of undertaking maintenance or repair themselves (04.3.1.1)", "locksmith services for cars (07.2.3.0)", "bodyguards (13.9.0.9)", "services engaged for major maintenance and repair (intermediate consumption) or for extension and conversion of the dwelling (capital formation)"], "tags": ["S"], "children": [{"code": "04.3.2.0", "title": "Services for the maintenance, repair and security of the dwelling", "intro": "The cost of materials is included only if the materials are not separately priced.", "includes": ["services of plumbers, electricians, carpenters, glaziers, painters, decorators, floor polishers, etc., engaged to carry out minor maintenance and repair of the dwelling", "locksmith services", "services related to laying of fitted carpets and linoleum", "security services"], "excludes": ["separate purchases of materials by households with the intention of undertaking maintenance or repair themselves (04.3.1.1)", "locksmith services for cars (07.2.3.0)", "bodyguards (13.9.0.9)", "services engaged for major maintenance and repair (intermediate consumption) or for extension and conversion of the dwelling (capital formation)"], "tags": ["S"]}]}]}, {"code": "04.4", "title": "Water supply and miscellaneous services relating to the dwelling", "childr ot require an overnight stay (06.2); inpatient care services provided during an overnight stay (06.3); and diagnostic imaging services, medical laboratory services, patient emergency transportation and emergency rescue services (06.4). Covered in group 06.1 are all medicines and health products that are separately priced from health services, except those medicines and health products administered under the direct supervision of a health-care professional during an overnight stay (06.3).\n\nThe products and services assigned to division 06 can be used only to achieve specific health aims: preventing illnesses and diseases (e.g., through vaccination); restoring or maintaining a particular state of health or preventing its deterioration; and curing illnesses, diseases and injuries, as well as relieving their symptoms; reducing their severity; or protecting against their exacerbation or their complications.\n\nThe division also includes services provided by health-care professionals purely for aesthetic beautification purposes (e.g., cosmetic surgery and teeth-whitening dental treatment).\n\nOn the other hand, division 06 excludes foods that are believed to be highly beneficial to health, especially food grown organically, as well as foods or food ingredients that have been shown to have a positive effect on specific functions or systems of the body (division 01).", "children": [{"code": "06.1", "title": "Medicines and health products", "includes": ["medicines; vaccines; pharmaceutical preparations; medical devices; assistive and other health", "related products used for the prevention, diagnosis and treatment of illnesses, diseases and injuries and purchased by individuals or households, either with or without a prescription, usually from pharmacies, health facilities and medical and assistive equipment suppliers as well as from reliable Internet sources. These products are intended for consumption or use outside a health facility or institution"], "excludes": ["medic  frames/walkers and artificial legs"], "excludes": ["dental implants and dentures, to be classified to 06.3.1.0 when an overnight stay is required and to 06.2.2.9 when an overnight stay is not required", "goggles for protection against potential eye damage resulting from the practice of a sport (09.2.2.1)", "walking sticks and canes for recreational purposes (hiking and tracking) (09.2.2.1)", "(non", "corrective) sunglasses and ear plugs (13.2.9.1)"], "tags": ["D"], "children": [{"code": "06.1.3.1", "title": "Assistive products for vision", "intro": "All assistive products whose primary purpose is to maintain or improve an individual's vision, to compensate for an impairment or loss of intrinsic visual function or to mitigate the consequences of a gradual decline in visual function.", "includes": ["corrective eyeglasses (spectacles) for low vision; and short", "and long", "distance spectacles", "white canes", "ocular prostheses (e.g., glass eyes) and contact lenses"], "excludes": ["walking sticks and canes for recreational purposes (e.g., hiking and tracking) (09.2.2.1)", "goggles for protection against potential eye damage resulting from the practice of a sport (09.2.2.1)", "(non", "corrective) sunglasses and protective glasses (13.2.9.1)"], "tags": ["D"]}, {"code": "06.1.3.2", "title": "Assistive products for hearing and communication", "intro": "All assistive products whose primary purpose is to maintain or improve an individual's hearing and capacity to communicate, to compensate for an impairment or loss of intrinsic hearing and communication capacity or to reduce the consequences of a gradual decline in functional hearing or communication capacity.", "includes": ["digital hearing aids"], "alsoIncludes": ["cleaning, adjustment and batteries if not priced separately from the product"], "tags": ["D"]}, {"code": "06.1.3.3", "title": "Assistive products for mobility and daily living", "intro": "All assistive products whose primary purpose is to maintain or improve }, {"code": "06.2", "title": "Outpatient care services", "intro": "Group 06.2 covers all preventive, dental, curative, rehabilitative and long-term care services that are not provided during an overnight stay. The admission criteria - as well as the setting in which the outpatient care services are provided and the type of health-care provider - are irrelevant. Those services may be delivered either within or outside a hospital setting (e.g., at home or in a walk-in clinic), by a variety of health-care providers. An outpatient care service includes all medicines and health products supplied directly by a health-care provider for consumption or use outside a health facility or institution, if not priced separately from that service.\n\nGroup 06.2 also includes respite care as well as services provided to maintain persons within their own home which are integrated into a package of outpatient medical care services.", "excludes": ["dental, curative, rehabilitative and long", "term care services provided during an overnight stay (06.3)", "control and follow", "up services for the treatment of symptoms that arise during the provision of overnight care (06.3)", "diagnostic imaging services and medical laboratory services priced separately from the preventive services (06.4)", "vaccines when priced separately from the preventive service itself (06.1.1.1)", "non", "medical services provided to maintain persons in the privacy of their own home that are not integrated into a medical care package (13.3.0.3)"], "children": [{"code": "06.2.1", "title": "Preventive care services", "intro": "Preventive services aim at preventing illnesses and diseases, and detecting the presence of diseases (e.g., through screening). The main distinction between preventive services and other outpatient services rests upon the fact that preventive services are administered before symptoms appear.", "includes": ["immunization and vaccination services", "family planning and counselling", "healthy condition monitoring services (e.g., prenatal and postnatal care services)", "general and routine check", "ups other than dental check", "ups", "check", "ups related to child growth and development", "early disease detection services, administered before the appearance of symptoms (including screening, diagnostic tests and medical examinations focused on detection of communicable and non", "communicable diseases"], "alsoIncludes": ["diagnostic imaging services and medical laboratory services needed for the provision of preventive services when those imaging and laboratory services are priced jointly with the time and skills of personnel associated with the delivery of those preventive services"], "excludes": ["dental, curative, rehabilitative and long", "term care services provided during an overnight stay (06.3)", "control and/or follow", "up services for the treatment of symptoms that arose during the provision of overnight care (06.3)", "diagnostic imaging services and medical laboratory services priced separately from outpatient preventive services (06.4)", "vaccines when priced separately from the preventive service itself (06.1.1.1)", "non", "medical services to maintain persons in the private home that are not integrated into a medical care package (13.3.0.2)"], "tags": ["S"], "children": [{"code": "06.2.1.1", "title": "Immunization services", "intro": "Immunization services cover the consultation, both for the time and skills of the personnel and the vaccine itself when priced jointly with the services.\n\nImmunization services include vaccination against, for example:\n* polio, rabies, rubella, tetanus, varicella (chickenpox) and yellow fever\n* influenza\n* measles\n* meningococcal infections, mumps, pertussis (whooping cough) and pneumococcal infections\n* diphtheria, hepatitis, herpes zoster and human papillomavirus (HPV) infection", "includes": ["immunization and vaccination services as a component of maternal care and childcare", "tourism and travel", "related vaccination as well as all other types of compulsory or voluntary immunization and vaccination services"], "excludes": ["the vaccine itself when priced separately from the service (06.1.1.1)"], "tags": ["S"]}, {"code": "06.2.1.9", "title": "Other preventive care services", "includes": ["family planning and counselling (including genetic counselling)", "prenatal and postnatal care services", "general and routine check", "up services, including as related to child growth and development", "identification of genetic abnormalities", "screening, diagnostic tests and medical examinations performed for the purpose of detecting communicable and non", "communicable diseases (e.g., malaria, tuberculosis, breast cancer, cervical cancer, colorectal cancer, prostate cancer, diabetes and HIV/AIDS) before symptoms appear", "all other medical services provided before symptoms appear"], "alsoIncludes": ["diagnostic imaging services and medical laboratory services (e.g., mammogram testing) needed for the provision of preventive services when those imaging and laboratory services are priced jointly with the time and skills of personnel"], "excludes": ["routine dental preventive check", "ups (06.2.2.1)", "control and follow", "up services for the treatment of symptoms that arise in the course of services that do not require an overnight stay (06.2.2 and 06.2.3)", "control and follow", "up services for the treatment of symptoms that arise during the provision of overnight care (06.3)", "laboratory and imaging services priced separately from preventive care services (06.4)"], "tags": ["S"]}]}, {"code": "06.2.2", "title": "Outpatient dental services", "includes": ["services of dentists, dental practitioners, dental surgeons and endodontists, maxillofacial and oral surgeons, oral pathologists, orthodontists, pedodontists, periodontists, prosthodontists, and oral hygienists and other dental auxiliaries that do not require an overnight stay"], "alsoIncludes": ["aesthetic dentistry services"], "excludes": ["all health products (e.g., assistive, medical, pharmaceutical, and therapeutic) needed to deliver outpatient dental services that are priced separately from the service of the provider (06.1)", "services of medical laboratories performing analytical testing and diagnostic imaging centres priced separately from dental services received (06.4.1.0)"], "tags": ["S"], "children": [{"code": "06.2.2.1", "title": "Dental preventive services", "includes": ["routine preventive dental check", "ups"], "tags": ["S"]}, {"code": "06.2.2.9", "title": "Other outpatient dental services", "includes": ["all other dental services that do not require an overnight stay (excluding preventive dental services)", "all cost concerning dentures (including the fitting costs)"], "alsoIncludes": ["aesthetic dentistry services"], "excludes": ["all health products (e.g., assistive, medical, pharmaceutical and therapeutic) needed to deliver outpatient dental services that are priced separately from the provider's services (06.1)", "services of medical laboratories performing analytic testing and diagnostic imaging centres priced separately from dental services received (06.4.1.0)"], "tags": ["S"]}]}, {"code": "06.2.3", "title": "Other outpatient care services", "intro": "Class 06.2.3 includes all medical services, other than preventive and dental services, that do not require an overnight stay and are aimed at relieving symptoms of illnesses, diseases and injuries (06.2.3.1); reducing the severity of illnesses, diseases and injuries (06.2.3.1); protecting against exacerbation or complications of illnesses, diseases and injuries (06.2.3.1); restoring health status (06.2.3.1); or preventing the deterioration of a health condition or maintaining the level of health that is available (06.2.3.2).\n\nThe admissions criteria and the type of provider, as well as the setting within which these curative and rehabilitative services and outpatient long-term care services are provided, are irrelevant as long as no overnight care is administered.", "includes": ["services provided at a hospital or in a hospital which do not entail an overnight stay (excluding preventive care services (06.2.1) and outpatient dental services (06.2.2)", "medical day", "care services, that is, services delivered in a hospital setting (sometimes in a medical day", "care centre) to a patient who has been formally admitted, as long as those services do not involve an overnight stay", "home", "based hospital treatment (e.g., dialysis) (06.2.3.2); medical services delivered at home (e.g., palliative care) (06.2.3.2); medical and nursing services provided to maintain persons in their own home, including the elderly and persons with disabilities (06.2.3.2); nursing care delivered at home, including care aimed at retarding or reducing deterioration, maintaining functionality (e.g., through nasogastric feeding) or managing chronic diseases (06.2.3.2)", "services delivered in an individual consulting facility (e.g., a private office) or in a group consulting facility (excluding preventive care services (06.2.1) and outpatient dental services (06.2.2)) by any type of provider (doctor, nurse, specialist or another type of health", "care practitioner)", "medical services delivered on the street (e.g., to homeless people) as well as any other outpatient services delivered outside a hospital setting"], "alsoIncludes": ["all health products (e.g., assistive, medical, pharmaceutical and therapeutic), diagnostic imaging services and medical laboratory services needed to deliver outpatient services not priced separately from the services of the provider (specialist, physician, nurse or another type of health", "care practitioner)"], "excludes": ["medicines and health products (medical, assistive) priced separately from the services of the provider (doctor, nurse, specialist or another health", "care practitioner) (06.1)", "preventive care services (06.2.1)", "outpatient dental services (06.2.2)", "diagnostic imaging services and medical laboratory services whose cost is priced separately from the service fee charged by the provider (specialist, physician, nurse specialist/ or another type of health", "care practitioner) (06.4.1.0)", "patient emergency transportation services and emergency rescue (06.4.2.0)"], "tags": ["S"], "children": [{"code": "06.2.3.1", "title": "Outpatient curative and rehabilitative services", "intro": "Subclass 06.2.3.1 comprises curative and rehabilitative services that do not require an overnight stay.\n\nCurative care comprises health-care contacts whose principal intent is to relieve symptoms of illnesses, diseases and injuries; to reduce the severity of illnesses, diseases and injuries; or to protect against exacerbation or complications of illnesses, diseases and injuries that could threaten life or normal function. Curative care services are aimed at restoring the patient's health status as it existed before the delivery of those services was deemed necessary.\n\nThe aim of rehabilitation is to enable optimal functioning to be achieved and maintained. Rehabilitation can, in some cases, improve a patient's health status; in other cases, it may only prevent deterioration.", "includes": ["all components of the curative care of illnesses and the treatment of injury, surgery performed, diagnostic and therapeutic procedures, and obstetric services, as long as those components do not involve an overnight stay", "outpatient curative and rehabilitative services irrespective of the type of provider, whether a specialist, physician or another type of health professional (e.g., a nurse or a midwife)", "outpatient curative and rehabilitative services provided in any setting such as a hospital without including an overnight stay, or an individual consulting facility (e.g., a private office), a group consulting facility, the patient's home or any other non", "hospital setting, including on the street", "physical, psychological and speech therapy, which includes the services of chiropractors; physiotherapists and physical therapists; speech therapists; audiologists; and inhalation and respiratory therapists, among others", "all health products (e.g., assistive, medical, pharmaceutical and therapeutic) needed to deliver outpatient curative and rehabilitative services that are not separately priced from the services of the provider (e.g., specialist, physician, nurse or another type of health", "care practitioner)"], "excludes": ["medicines and health products (medical, assistive) priced separately from the services of the provider (e.g., specialist, physician, nurse or another type of health", "care practitioner) (06.1)", "preventive care services (06.2.1)", "outpatient dental services (06.2.2)", "diagnostic imaging services and medical laboratory services priced separately from the services of the provider (specialist, physician, nurse or another type of health", "care practitioner) (06.4.1.0)", "patient emergency transportation services and emergency rescue (06.4.2.0)"], "tags": ["S"]}, {"code": "06.2.3.2", "title": "Outpatient long-term care services", "intro": "The aim of outpatient long-term care services is not to cure an illness or rehabilitate an individual, but rather to prevent deterioration of the individual's health condition and to thereby maintain it at a level available. Specific medical and nursing services are inherent contributors to this type of status quo. Individuals who may receive outpatient long-term care include elderly persons whose capacity to perform daily activities is limited, physically disabled household members and persons with chronic conditions.\n\nSometimes, outpatient long-term care services are part of a package of services that include social assistance and social transfer. Wherever possible in such cases, only the medical component should be classified to division 06; the social protection component should be classified to division 13. In cases where it is not possible to clearly distinguish between the components, the choice of division should depend on which component in the package of services is predominant. If the social protection component predominates, then the package should be classified to division 13; if it is the medical component that predominates, then the package should be classified to division 06.", "includes": ["services provided by medical day", "care centres, including services for the elderly and persons with disabilities", "treatment in hospitals, provided in the course of home", "based long", "term care, which does not entail an overnight stay (e.g., dialysis)", "medical and nursing services designed to maintain persons (including the elderly and persons with disabilities) in their own home", "nursing care delivered at home, including care aimed at retarding or reducing deterioration or maintaining functionality (e.g., nasogastric feeding) and care provided for the management of chronic diseases (e.g., administration of psychiatric prescription medications)", "non", "medical services delivered to maintain persons in their own home that are integrated into a package of care services and priced jointly with the other services", "all health products (e.g., assistive, medical, pharmaceutical and therapeutic), diagnostic imaging services and medical laboratory services needed for the delivery of outpatient services priced jointly with the service of the provider (specialist, physician, nurse or another type of health", "care practitioner)"], "excludes": ["medicines and health products (medical, assistive) priced separately from the service of the provider (specialist, physician, nurse or another type of health", "care practitioner) (06.1)", "diagnostic imaging services and medical laboratory services priced separately from the service fee of the provider (specialist, physician, nurse or another type of health", "care practitioner) (06.4.1.0)", "patient emergency transportation services and emergency rescue (06.4.2.0)", "social assistance services including care delivered to enable a person to live independently in a house or an apartment; community and leisure activities; and occupational support provided on a continuing or recurrent basis (13.3.0.3)"], "tags": ["S"]}]}]}, {"code": "06.3", "title": "Inpatient care services", "intro": "The main distinction between outpatient care services (06.2) and inpatient care services (06.3) is based on whether or not an overnight stay is required. The type of provider is irrelevant: it may be a hospital, a nursing care facility or a facility that, while classified as a provider of ambulatory care, occasionally performs procedures requiring overnight accommodation.\n\nThe provider can also be a health facility within any type of establishment that accommodates patients who require an overnight stay. Hospitals and sanatoriums for tuberculosis patients are often organized to include accommodation along with medical treatment, which is the predominant purpose of the stay in such a facility.", "includes": ["inpatient care services comprising treatment and/or care, including dental treatment and/or care, that require an overnight stay", "all medical services needed to deliver inpatient care during the overnight stay even if separately priced (e.g., laboratory tests, diagnostic imaging services)", "medicines and health products (medical, assistive) needed to deliver inpatient services during an overnight stay, even if separately priced"], "alsoIncludes": ["patient accommodation services including meal service and cleaning, even if separately priced, and the hosting of a patient's relatives associated with the overnight stay", "beauty treatments performed in a hospital (e.g., cosmetic surgery, other than reconstructive)"], "excludes": ["hospital day care entailing no overnight stay (with or without admission) and home", "based hospital treatment (06.2)", "services delivered in a hospital or a hospital setting without an overnight stay (06.2) including services provided by facilities, such as surgeries, clinics and dispensaries, devoted exclusively to outpatient care (06.2)", "emergency patient transportation services and emergency rescue (06.4.2.0)", "services provided by non", "medical retirement homes for elderly persons; non", "medical residences for disabled persons; non", "medical rehabilitation centres offering primarily long", "term social support; and retirement villages without inpatient medical services (13.3.0.2)"], "children": [{"code": "06.3.1", "title": "Inpatient curative and rehabilitative services", "intro": "This category comprises inpatient curative, dental and rehabilitative care that requires an overnight stay. The principal purpose of the inpatient curative care administered during the overnight stay is to relieve the symptoms of an illness, disease or injury, to reduce its severity or to protect against the exacerbation or the complications that could be life threatening or a threat to normal functioning. Inpatient rehabilitation services that require an overnight stay are provided so that optimal functioning can be achieved and maintained.", "includes": ["curative and rehabilitative services provided for treatment and/or care (including dental treatment and/or care) that requires an overnight stay, as delivered by all types of providers (e.g., hospitals, nursing care facilities and facilities that, while classified as ambulatory care providers, occasionally perform procedures requiring overnight accommodation; alcohol and drug rehabilitation facilities (other than licensed hospitals); mental health convalescent homes and hospitals; and other types of health facilities located within an establishment that accommodates patients who require an overnight stay", "all medical services required to deliver inpatient care during an overnight stay even if separately priced (e.g., laboratory tests, diagnostic imaging services)", "medicines and health products (medical, assistive) needed in the delivery of inpatient services during the overnight stay, even if separately priced from the inpatient care services"], "alsoIncludes": ["patient accommodation services including meal service and cleaning, even if separately priced from the inpatient care services; and the hosting of the patient's relatives, if indispensable, also if separately priced", "beauty treatments performed in a hospital (e.g., cosmetic surgery, other than reconstructive)"], "excludes": ["hospital day care (with or without admission and without an overnight stay) and home", "based hospital treatment (06.2)", "services provided in a hospital or a hospital setting without an overnight stay (06.2), including services provided by facilities, such as surgeries, clinics and dispensaries, devoted exclusively to outpatient care (06.2)", "patient emergency transportation services and emergency rescue (06.4.2.0)", "services provided by non", "medical retirement homes for elderly persons, non", "medical institutions for disabled persons, non", "medical rehabilitation centres offering primarily long", "term social support and retirement villages that do not offer inpatient medical services (13.3.0.2)"], "tags": ["S"], "children": [{"code": "06.3.1.0", "title": "Inpatient curative and rehabilitative services", "intro": "This category comprises inpatient curative, dental and rehabilitative care that requires an overnight stay. The principal purpose of the inpatient curative care administered during the overnight stay is to relieve the symptoms of an illness, disease or injury, to reduce its severity or to protect against the exacerbation or the complications that could be life threatening or a threat to normal functioning. Inpatient rehabilitation services that require an overnight stay are provided so that optimal functioning can be achieved and maintained.", "includes": ["curative and rehabilitative services provided for treatment and/or care (including dental treatment and/or care) that requires an overnight stay, as delivered by all types of providers (e.g., hospitals, nursing care facilities and facilities that, while classified as ambulatory care providers, occasionally perform procedures requiring overnight accommodation; alcohol and drug rehabilitation facilities (other than licensed hospitals); mental health convalescent homes and hospitals; and other types of health facilities located within an establishment that accommodates patients who require an overnight stay", "all medical services required to deliver inpatient care during an overnight stay even if separately priced (e.g., laboratory tests, diagnostic imaging services)", "medicines and health products (medical, assistive) needed in the delivery of inpatient services during the overnight stay, even if separately priced from the inpatient care services"], "alsoIncludes": ["patient accommodation services including meal service and cleaning, even if separately priced from the inpatient care services; and the hosting of the patient's relatives, if indispensable, also if separately priced", "beauty treatments performed in a hospital (e.g., cosmetic surgery, other than reconstructive)"], "excludes": ["hospital day care (with or without admission and without an overnight stay) and home", "based hospital treatment (06.2)", "services provided in a hospital or a hospital setting without an overnight stay (06.2), including services provided by facilities, such as surgeries, clinics and dispensaries, devoted exclusively to outpatient care (06.2)", "patient emergency transportation services and emergency rescue (06.4.2.0)", "services provided by non", "medical retirement homes for elderly persons, non", "medical institutions for disabled persons, non", "medical rehabilitation centres offering primarily long", "term social support and retirement villages that do not offer inpatient medical services (13.3.0.2)"], "tags": ["S"]}]}, {"code": "06.3.2", "title": "Inpatient long-term care services", "intro": "This category comprises long-term care services that require an overnight stay.\n\nThe aim of inpatient long-term care services is not to cure an illness or rehabilitate an individual, but rather to prevent deterioration of the individual's health condition and to thereby maintain it at a level available. Specific medical and nursing services are inherent contributors to this type of status quo.\n\nIndividuals who receive inpatient long-term care include elderly persons whose capacity to perform daily activities is limited, physically disabled household members and persons with chronic conditions.", "includes": ["services provided by medical convalescent homes and convalescent hospitals; homes for the elderly offering nursing care; inpatient care hospices", "services of palliative care facilities for the terminally ill", "services of nursing homes; rest homes offering nursing care", "services of skilled nursing facilities", "services of teaching nursing homes", "services of residential mental retardation facilities; and mental health and substance abuse facilities for chronic patients (e.g., those with dementia)", "services of medical retirement homes for the elderly and medical residences for persons with disabilities", "all medical services needed for the delivery of inpatient care services during an overnight stay (e.g., laboratory tests, diagnostic imaging services)", "medicines and health products (medical, assistive) needed in the delivery of inpatient services during an overnight stay"], "alsoIncludes": ["patient accommodation services including meal service and cleaning, even if separately priced from the impatient long", "term care services; and services associated with the hosting of a patient's relatives, if indispensable, during the patient's overnight stay, also if separately priced"], "excludes": ["social protection services (13.3)", "non", "medical retirement homes for elderly persons and non", "medical residences for disabled persons (13.3.0.2)"], " d emergency rescue services", "includes": ["ambulance services for individuals, with or without emergency rescue", "medical emergency transportation by airplane or other types of vehicles, whether or not they have been specially adapted for medical purposes"], "alsoIncludes": ["medical transport services memberships"], "tags": ["S"]}]}]}]}, {"code": "07", "title": "Transport", "intro": "Under division 07, goods and services for the purpose of transportation are classified within four main categories: purchase of vehicles (07.1), goods and services associated with the operation of personal transport equipment (07.2), passenger transport services (07.3) and transport services of goods (07.4).\n\nPurchase of vehicles covers motor cars, motorcycles, bicycles and animal-drawn vehicles. Owing to the high share of second-hand motor vehicles in private consumption expenditures, separate subclasses for new and second-hand motor cars have been established.\n\nGroup 07.2 (operation of personal transport equipment) covers parts and accessories and fuels and lubricants for personal transport equipment and the repair and maintenance of that equipment. Also included in this group are expenditures for parking spaces in garages and public places, expenditures on tolls and expenditures associated with the acquisition of a driving licence.\n\nPassenger transport services (07.3) are structured based on the mode of transport. However, since transport tickets may be for travel using more than one mode of transport, a class covering combined passenger transport (07.3.6) was created.\n\nGroup 07.4 covers postal and courier services, as well as removal and storage services and delivery services of any kinds of goods, if separately priced.\n\nDivision 07, however, does not cover purchases of recreational vehicles, such as camper vans, caravans, trailers, aeroplanes and boats (09.1.2).", "children": [{"code": "07.1", "title": "Purchase of vehicles", "includes": ["purchase of vehicles used for ) provides learning experiences building on secondary education, preparing for entry into the labour market and tertiary education. It is aimed at the individual acquisition of knowledge, skills and competencies lower than the level of complexity characteristic of tertiary education. Post", "secondary non", "tertiary education is typically designed to provide individuals who completed upper secondary education without qualifications required for progression to tertiary education and/or for individuals seeking specific types of employment when their secondary qualification does not grant such access. For example, graduates from general secondary programmes may choose to complete a non", "tertiary vocational qualification or graduates from vocational secondary programmes may choose to increase their level of qualifications or specialize further. Usually, programmes at this level are designed for direct entry into the labour market. General programmes designed to give access to or improved access to tertiary education can also exist", "out", "of", "school post", "secondary non", "tertiary education for adults and young people", "education services for young people and adults with special educational needs"], "alsoIncludes": ["excursions or student exchanges that are part of the normal school programme (travel and accommodation costs)"], "tags": ["S"], "children": [{"code": "10.3.0.0", "title": "Post-secondary non-tertiary education", "includes": ["level 4 of ISCED 2011 (post", "secondary non", "tertiary education) provides learning experiences building on secondary education, preparing for entry into the labour market and tertiary education. It is aimed at the individual acquisition of knowledge, skills and competencies lower than the level of complexity characteristic of tertiary education. Post", "secondary non", "tertiary education is typically designed to provide individuals who completed upper secondary education without qualifications required for progression to y the other forms of actual and indirect charges and remittance fees for financial services. For the definition and the measurement of the insurance and financial services, specific national account concepts (2008 SNA) do apply.", "children": [{"code": "12.1", "title": "Insurance", "intro": "Service charges for insurance are classified by type of insurance, namely, life insurance and non-life insurance (i.e., insurance in connection with the dwelling, health, transport, etc.). Service charges for multi-risk insurance covering several risks should be classified on the basis of the cost of the principal risk if it is not possible to allocate the service charges to the various risks covered.\n\nThe basic method for measuring the service charge for non-life insurance is total premiums earned plus investment income earned from investing the premiums, less adjusted claims incurred.\n\nThe basic method for measuring the service charge for life insurance is premiums earned plus investment income earned from investing the premiums, less benefits due to fewer increases (plus decreases) in life insurance technical reserves.", "children": [{"code": "12.1.1", "title": "Life and accident insurance", "includes": ["service charges for life insurance, annuities, death benefit insurance, education insurance and so on"], "alsoIncludes": ["service charges for funeral insurance", "service charges for accident insurance"], "tags": ["S"], "children": [{"code": "12.1.1.0", "title": "Life and accident insurance", "includes": ["service charges for life insurance, annuities, death benefit insurance, education insurance and so on"], "alsoIncludes": ["service charges for funeral insurance", "service charges for accident insurance"], "tags": ["S"]}]}, {"code": "12.1.2", "title": "Insurance connected with health", "includes": ["service charges for direct sickness insurance", "service charges for social health insurance", "service charges for disability insurance", "service charges for critical il         function getLevel(code) {
            if (code.includes('.')) return code.split('.').length;
            return 1;
        }
        
        function flattenData(data, maxLevel, result = []) {
            for (const item of data) {
                const level = getLevel(item.code);
                if (level <= maxLevel) {
                    result.push(item);
                    if (item.children && level < maxLevel) {
                        flattenData(item.children, maxLevel, result);
                    }
                }
            }
            return result;
        }
        
        function toggleTOC(el, event) {
            event.stopPropagation();
            event.preventDefault();
            const li = el.closest('.toc-item');
            if (li) {
                li.classList.toggle('expanded');
            }
        }

        function renderTOC(data, container, maxLevel) {
            let html = `<ul class="toc-list">`;
            for (const item of data) {
                const itemLevel = getLevel(item.code);
                const hasChildren = item.children && item.children.length > 0;
                // Auto-expand based on maxLevel selection
                const isExpanded = itemLevel < maxLevel;
                
                html += `<li class="toc-item ${hasChildren ? 'has-children' : ''} ${isExpanded ? 'expanded' : ''}">
                    <div class="toc-row" data-code="${item.code}">
                        ${hasChildren ? `<span class="toc-toggle" onclick="toggleTOC(this, event)">▶</span>` : `<span class="toc-toggle-empty"></span>`}
                        <a class="toc-link" href="#${item.code}">
                            <span class="code">${item.code}</span>
                            <span class="title">${item.title}</span>
                        </a>
                    </div>`;
                
                if (hasChildren) {
                    html += renderTOC(item.children, null, maxLevel);
                }
                html += '</li>';
            }
            html += '</ul>';
            if (container) container.innerHTML = html;
            return html;
        }
        
        function escapeHtml(unsafe) {
            return (unsafe||"").toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }
        
        function formatText(text) {
            if (!text) return "";
            
            // Format links
            let formatted = text.replace(/\b(\d{2}(\.\d{1,2})*)\b/g, '<a href="#$1" class="code-link">$1</a>');
            
            // Format abbreviations
            formatted = formatted.replace(/\(S\)/g, '(<abbr title="Services">S</abbr>)');
            formatted = formatted.replace(/\(ND\)/g, '(<abbr title="Non-durables">ND</abbr>)');
            formatted = formatted.replace(/\(SD\)/g, '(<abbr title="Semi-durables">SD</abbr>)');
            formatted = formatted.replace(/\(D\)/g, '(<abbr title="Durables">D</abbr>)');
            formatted = formatted.replace(/\bn\.e\.c\./g, '<abbr title="Not elsewhere classified">n.e.c.</abbr>');
            
            return formatted;
        }

        function renderContent(data, container, maxLevel) {
            const flatItems = flattenData(data, maxLevel);
            let html = '';
            
            for (const item of flatItems) {
                const level = getLevel(item.code);
                const headingTag = 'h' + Math.min(level + 1, 6);
                
                let titleHtml = formatText(escapeHtml(item.title));
                if (item.tags && item.tags.length > 0) {
                    titleHtml += ' ' + formatText('(' + item.tags.join(', ') + ')');
                }
                
                html += `<div class="content-item" id="${item.code}">`;
                html += `<${headingTag}>${titleHtml}<span class="code">${item.code}</span></${headingTag}>`;
                
                if (item.intro) {
                    html += `<div class="content-description">${formatText(escapeHtml(item.intro))}</div>`;
                }
                
                if (item.includes && item.includes.length > 0) {
                    html += `<details class="collapsible" open><summary class="includes">Includes</summary><ul>`;
                    for (const inc of item.includes) html += `<li>${formatText(escapeHtml(inc))}</li>`;
                    html += `</ul></details>`;
                }

                if (item.alsoIncludes && item.alsoIncludes.length > 0) {
                    html += `<details class="collapsible" open><summary class="includes" style="color: #0277bd;">Also Includes</summary><ul>`;
                    for (const inc of item.alsoIncludes) html += `<li>${formatText(escapeHtml(inc))}</li>`;
                    html += `</ul></details>`;
                }
                
                if (item.excludes && item.excludes.length > 0) {
                    html += `<details class="collapsible" open><summary class="excludes">Excludes</summary><ul>`;
                    for (const exc of item.excludes) html += `<li>${formatText(escapeHtml(exc))}</li>`;
                    html += `</ul></details>`;
                }
                
                html += '</div>';
            }
            
            container.innerHTML = html;
        }
        
        let contentRendered = false;
        let scrollObserver = null;
        
        function render(forceContent = false) {
            const maxLevel = parseInt(document.getElementById('level-select').value);
            renderTOC(coicopData, document.getElementById('toc-container'), maxLevel);
            
            if (!contentRendered || forceContent) {
                renderContent(coicopData, document.getElementById('content-container'), 6); // Always render all content
                contentRendered = true;
                setupScrollspy();
            }
        }
        
        document.getElementById('level-select').addEventListener('change', () => render(false));
        
        function setupScrollspy() {
            if (scrollObserver) scrollObserver.disconnect();
            
            const contentItems = document.querySelectorAll('.content-item');
            
            scrollObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        const tocRows = document.querySelectorAll('.toc-row');
                        tocRows.forEach(row => {
                            row.classList.toggle('active', row.dataset.code === id);
                            
                            // Scroll TOC to active item if needed
                            if (row.dataset.code === id && row.classList.contains('active')) {
                                // Do NOT automatically expand lower levels on scroll
                                // Only scroll the TOC to the active item if it is currently visible
                                const tocItem = row.closest('.toc-item');
                                let isVisible = true;
                                let parentItem = tocItem.parentElement.closest('.toc-item');
                                while (parentItem) {
                                    if (!parentItem.classList.contains('expanded')) {
                                        isVisible = false;
                                        break;
                                    }
                                    parentItem = parentItem.parentElement.closest('.toc-item');
                                }
                                
                                if (isVisible) {
                                    const container = document.getElementById('toc-container');
                                    const rowTop = row.offsetTop;
                                    const containerTop = container.scrollTop;
                                    const containerHeight = container.clientHeight;
                                    
                                    if (rowTop < containerTop || rowTop > containerTop + containerHeight - 50) {
                                        container.scrollTop = rowTop - containerHeight / 2;
                                    }
                                }
                            }
                        });
                    }
                });
            }, { rootMargin: '-20% 0px -70% 0px' });
            
            contentItems.forEach(item => scrollObserver.observe(item));
        }
        
        render(true);
        
        // Handle fragment navigation on load
        window.addEventListener('load', () => {
            if (window.location.hash) {
                const id = window.location.hash.substring(1);
                const target = document.getElementById(id);
                if (target) {
                    setTimeout(() => target.scrollIntoView(), 100);
                }
            }
        });

        // Add smooth scrolling for internal links and expand TOC
        document.addEventListener('click', function(e) {
            let link = e.target.closest('a');
            if (link && link.getAttribute('href') && link.getAttribute('href').startsWith('#')) {
                const id = link.getAttribute('href').substring(1);
                
                // If it's a TOC link, expand it (but not all its children)
                if (link.classList.contains('toc-link')) {
                    const tocItem = link.closest('.toc-item');
                    if (tocItem) {
                        tocItem.classList.add('expanded');
                    }
                }
                
                const target = document.getElementById(id);
                if (target) {
                    e.preventDefault();
                    target.scrollIntoView({ behavior: 'smooth' });
                    history.pushState(null, null, '#' + id);
                }
            }
        });
    </script>
</body>
</html>
